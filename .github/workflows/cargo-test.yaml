on:
  pull_request:
    paths:
      - 'actix-api/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'dioxus-ui/**'
      - 'docker/**'
      - 'neteq/**'
      - 'videocall-client/**'
      - 'meeting-api/**'
      - 'dbmate/**'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'
name: check backend

jobs:
  test:
    name: cargo tests_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-tests-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-tests-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      # Middleware (postgres/nats) AND tests run natively — zero docker
      - run: make tests_run

      - name: Teardown
        if: always()
        run: make tests_down

  meeting-api-sqlite:
    name: meeting-api (sqlite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:/tmp/meeting_api_test.sqlite3
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-sqlite-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-sqlite-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-meeting-api-sqlite-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-meeting-api-sqlite-

      - name: Run SQLite migrations
        run: nix-shell default.nix -A shells.backend-dev --run "cd dbmate/sqlite && dbmate up"

      - name: Clippy (sqlite feature)
        run: nix-shell default.nix -A shells.backend-dev --run "cargo clippy -p meeting-api --no-default-features --features sqlite -- -D warnings"

      - name: Test (sqlite feature)
        run: nix-shell default.nix -A shells.backend-dev --run "cargo test -p meeting-api --no-default-features --features sqlite -- --test-threads=1"
