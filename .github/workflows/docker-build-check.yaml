name: Docker Build Check

# PR gate: prove every app image derivation builds (no push). Same
# `release.nix` attrs CI publishes and `make images` loads locally — see
# docs/nix-architecture.md.
on:
  pull_request:
    paths:
      # API image dependencies
      - 'actix-api/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # UI image dependencies
      - 'dioxus-ui/**'
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      # Meeting API dependencies
      - 'meeting-api/**'
      - 'videocall-meeting-types/**'
      - 'dbmate/**'
      # Bot dependencies
      - 'bot/**'
      # Nix build system
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  # Warm the crane deps-only derivations first: on a cold cache (first PR
  # after a Cargo.lock/toml change) the expensive dependency compile happens
  # exactly once here instead of once per matrix leg; on a warm cache this is
  # a fast substitution.
  warm-deps:
    name: Warm dependency caches
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build deps-only derivations
        run: nix-build release.nix -A packages.nativeDeps -A packages.wasmDeps --no-out-link

  # Parallel matrix (like the old per-Dockerfile jobs): wall time = slowest
  # leg; each leg substitutes the warmed deps and compiles only workspace
  # crates.
  build-images:
    name: Build Nix images (${{ matrix.name }})
    needs: warm-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: actix-services
            attrs: -A images.media-server -A images.websocket-server -A images.webtransport-server -A images.metrics-server -A images.server-stats
          - name: meeting-api-and-bot
            attrs: -A images.meeting-api -A images.bot
          - name: dioxus-ui
            attrs: -A images.dioxus-ui
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build image derivations (no push)
        run: nix-build release.nix ${{ matrix.attrs }} --no-out-link
