name: Docker Build Check

# PR gate: prove every app image derivation builds (no push). Same
# `release.nix` attrs CI publishes and `make images` loads locally — see
# docs/nix-architecture.md.
on:
  pull_request:
    paths:
      # API image dependencies
      - 'actix-api/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # UI image dependencies
      - 'dioxus-ui/**'
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      # Meeting API dependencies
      - 'meeting-api/**'
      - 'videocall-meeting-types/**'
      - 'dbmate/**'
      # Bot dependencies
      - 'bot/**'
      # Nix build system
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  build-images:
    name: Build all Nix images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build every image derivation (no push)
        run: nix-build release.nix -A images.all --no-out-link
