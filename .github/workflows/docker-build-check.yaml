name: Docker Build Check

# PR gate: prove every app image derivation builds (no push). Same
# `release.nix` attrs CI publishes and `make images` loads locally — see
# docs/nix-architecture.md.
on:
  pull_request:
    paths:
      # API image dependencies
      - 'actix-api/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # UI image dependencies
      - 'dioxus-ui/**'
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      # Meeting API dependencies
      - 'meeting-api/**'
      - 'videocall-meeting-types/**'
      - 'dbmate/**'
      # Bot dependencies
      - 'bot/**'
      # Nix build system
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  # 10-second probe: is the warm cache already seeded for this pins+lockfile
  # state? On warm runs the expensive warm job is skipped entirely and the
  # matrix starts immediately.
  cache-probe:
    name: Probe warm cache
    runs-on: ubuntu-latest
    outputs:
      hit: ${{ steps.probe.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="nix-images-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/caches?key=$KEY" --jq '.total_count')
          echo "key=$KEY count=$COUNT"
          [ "$COUNT" != "0" ] && echo "hit=true" >> "$GITHUB_OUTPUT" || echo "hit=false" >> "$GITHUB_OUTPUT"

  # Cold path only (first PR after a pins/lockfile change): build the full
  # non-member closure — crane deps artifacts AND image runtime payloads
  # (static caddy/busybox/dbmate, go toolchain, musl tzdata/cacert) — exactly
  # once, and save it. Without ciWarm the legs rebuilt go-1.25.5 & friends on
  # every run and never saved them (exact-key hit skips their save).
  warm-deps:
    name: Warm dependency caches
    needs: cache-probe
    if: needs.cache-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-images-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-images-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Build the full non-member closure
        run: nix-build release.nix -A packages.ciWarm --no-out-link

  # Parallel matrix (like the old per-Dockerfile jobs): wall time = slowest
  # leg; each leg substitutes the warmed closure and compiles only workspace
  # crates.
  build-images:
    name: Build Nix images (${{ matrix.name }})
    needs: [cache-probe, warm-deps]
    if: ${{ !cancelled() && needs.cache-probe.result == 'success' && (needs.warm-deps.result == 'success' || needs.warm-deps.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: actix-services
            attrs: -A images.media-server -A images.websocket-server -A images.webtransport-server -A images.metrics-server -A images.server-stats
          - name: meeting-api-and-bot
            attrs: -A images.meeting-api -A images.bot
          - name: dioxus-ui
            attrs: -A images.dioxus-ui
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-images-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-images-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Build image derivations (no push)
        run: nix-build release.nix ${{ matrix.attrs }} --no-out-link
