name: Docker Build Check

# PR gate: prove every app image derivation builds (no push). Same
# `release.nix` attrs CI publishes and `make images` loads locally — see
# docs/nix-architecture.md.
on:
  pull_request:
    paths:
      # API image dependencies
      - 'actix-api/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # UI image dependencies
      - 'dioxus-ui/**'
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      # Meeting API dependencies
      - 'meeting-api/**'
      - 'videocall-meeting-types/**'
      - 'dbmate/**'
      # Bot dependencies
      - 'bot/**'
      # Nix build system
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  # Three self-sufficient legs. Dependencies, toolchains and runtime payloads
  # substitute from cachix (videocall-rs.cachix.org) — pushed once, org-wide —
  # so each leg compiles ONLY the workspace crates the PR touched, then
  # assembles layers. Measured: 2m24s-4m50s per leg on a warm cache vs ~10m
  # wall for the docker-era 4-job matrix.
  #
  # No warm-up job and no GHA store snapshot on purpose:
  # - nix-community/cache-nix-action restored files under the RUNNING nix
  #   daemon, whose open SQLite db never saw them — nix planned 1566-drv full
  #   rebuilds right after "successful" 1.6GB restores, on every run.
  # - with cachix substitution a warm-up job only serializes the matrix; on a
  #   cold cache (lockfile/pin bump) the legs race-build deps redundantly, but
  #   that is rare and does not extend wall time.
  build-images:
    name: Build Nix images (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: actix-services
            attrs: -A images.media-server -A images.websocket-server -A images.webtransport-server -A images.metrics-server -A images.server-stats
          - name: meeting-api-and-bot
            attrs: -A images.meeting-api -A images.bot
          - name: dioxus-ui
            attrs: -A images.dioxus-ui
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build image derivations (no push)
        run: nix-build release.nix ${{ matrix.attrs }} --no-out-link
