name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Native stack, no docker: the runner is Linux, so the servers are the
      # nix-built binaries (substituted from cachix) and the UI is the
      # nix-built release dist served by caddy.
      - name: Run E2E pipeline
        run: make check-e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: cat /tmp/videocall-e2e-stack.log || true

      - name: Teardown (safety net)
        if: always()
        run: make e2e-down || true
