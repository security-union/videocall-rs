name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # e2e-build nix-builds the app images (natively — the runner is Linux)
      # and docker-loads them; the e2e compose stack runs those images.
      - name: Run E2E pipeline
        run: make e2e-ci

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose -p videocall-e2e -f docker/docker-compose.e2e.yaml logs

      - name: Teardown (safety net)
        if: always()
        run: docker compose -p videocall-e2e -f docker/docker-compose.e2e.yaml down -v || true
