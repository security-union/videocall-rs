name: helm-image-pin

# Tests for the helm-image-pin tool (helm-image-pin/README.md). They need no
# network: the registry, git and clock are faked.

on:
  pull_request:
    paths:
      - 'helm-image-pin/**'
      - 'helm-image-pin.toml'
      - 'helm/global/us-east/*/values.yaml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'nix/**'
      - '.github/workflows/helm-image-pin-test.yaml'
  push:
    branches: [main]
    paths:
      - 'helm-image-pin/**'
      - 'helm-image-pin.toml'
      - '.github/workflows/helm-image-pin-test.yaml'

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: videocall-rs

      - name: Format
        run: nix-shell default.nix -A shells.backend-dev --run "cargo fmt -p helm-image-pin --check"

      - name: Clippy
        run: nix-shell default.nix -A shells.backend-dev --run "cargo clippy --locked -p helm-image-pin --all-targets -- -D warnings"

      - name: Test
        run: nix-shell default.nix -A shells.backend-dev --run "cargo test --locked -p helm-image-pin"
