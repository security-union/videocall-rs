name: Keychain Probe (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/keychain-probe.yaml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe program
        run: |
          mkdir -p /tmp/probe/src && cd /tmp/probe
          cat > Cargo.toml <<'TOML'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          keyring = { version = "3.6", features = ["apple-native"] }
          TOML
          cat > src/main.rs <<'RS'
          use std::time::Instant;
          fn main() {
              let t = Instant::now();
              let e = keyring::Entry::new("videocall-cli-probe", "acct").unwrap();
              let set = e.set_password("secret");
              let got = e.get_password();
              let del = e.delete_credential();
              println!("set={:?} get={:?} delete={:?} in {:?}", set.map_err(|e| e.to_string()), got.map_err(|e| e.to_string()), del.map_err(|e| e.to_string()), t.elapsed());
          }
          RS
          cargo build -q 2>&1 | tail -3
      - name: Probe conditions
        run: |
          set +e
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          cat > /tmp/probe/src/main.rs <<'RS'
          fn main() {
              let e = keyring::Entry::new("videocall-cli-probe", "acct").unwrap();
              let arg = std::env::args().nth(1).unwrap_or_default();
              match arg.as_str() {
                  "set" => println!("set={:?}", e.set_password("secret").map_err(|e| e.to_string())),
                  "get" => println!("get={:?}", e.get_password().map_err(|e| e.to_string())),
                  _ => println!("delete={:?}", e.delete_credential().map_err(|e| e.to_string())),
              }
          }
          RS
          (cd /tmp/probe && cargo build -q 2>&1 | tail -3)
          P=/tmp/probe/target/debug/probe
          run() { echo "--- $*"; start=$(date +%s); tmo 20 $P "$@" 2>&1; echo "exit=$? after $(( $(date +%s) - start ))s"; }
          KC=$RUNNER_TEMP/probe.keychain-db
          security create-keychain -p pw "$KC"
          security default-keychain -s "$KC"
          security list-keychains -d user -s "$KC"
          security set-keychain-settings -t 3600 "$KC"
          security unlock-keychain -p pw "$KC"
          run set
          echo "=== G: keychain file moved away (default pref unchanged)"
          mv "$KC" "$KC.away"
          security default-keychain
          run set; run get; run delete
          echo "=== H: moved back"
          mv "$KC.away" "$KC"
          run get
          echo "=== I: locked: get / delete too?"
          security lock-keychain "$KC"
          run get; run delete
          security unlock-keychain -p pw "$KC"
          echo "=== J: keychain removed from list+default via delete-keychain, then recreated and reset"
          run get
          echo "=== K: default pointing at a directory"
          security delete-keychain "$KC"
          security default-keychain
          run set
          NEW=$RUNNER_TEMP/new.keychain-db
          security create-keychain -p pw "$NEW"; security default-keychain -s "$NEW"; security list-keychains -d user -s "$NEW"; security unlock-keychain -p pw "$NEW"
          run set; run get; run delete
