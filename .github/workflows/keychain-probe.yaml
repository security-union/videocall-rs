name: Keychain Probe (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/keychain-probe.yaml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe program
        run: |
          mkdir -p /tmp/probe/src && cd /tmp/probe
          cat > Cargo.toml <<'TOML'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          keyring = { version = "3.6", features = ["apple-native"] }
          TOML
          cat > src/main.rs <<'RS'
          use std::time::Instant;
          fn main() {
              let t = Instant::now();
              let e = keyring::Entry::new("videocall-cli-probe", "acct").unwrap();
              let set = e.set_password("secret");
              let got = e.get_password();
              let del = e.delete_credential();
              println!("set={:?} get={:?} delete={:?} in {:?}", set.map_err(|e| e.to_string()), got.map_err(|e| e.to_string()), del.map_err(|e| e.to_string()), t.elapsed());
          }
          RS
          cargo build -q 2>&1 | tail -3
      - name: Probe conditions
        run: |
          set +e
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          run() {
            echo "=== $1"; shift
            start=$(date +%s)
            tmo 25 /tmp/probe/target/debug/probe 2>&1
            echo "exit=$? after $(( $(date +%s) - start ))s"
          }
          echo "--- initial state"; security list-keychains; security default-keychain; id; launchctl managername 2>&1
          KC=$RUNNER_TEMP/probe.keychain-db
          security create-keychain -p pw "$KC"
          security default-keychain -s "$KC"
          security list-keychains -d user -s "$KC"
          security set-keychain-settings -t 3600 "$KC"
          security unlock-keychain -p pw "$KC"
          run "A: unlocked temp default"
          security lock-keychain "$KC"
          run "B: locked temp default"
          security unlock-keychain -p pw "$KC"
          chmod a-w "$KC"
          run "F: read-only keychain file"
          chmod u+w "$KC"
          security default-keychain -d user -s /nonexistent/nope.keychain-db
          echo "default now:"; security default-keychain
          run "C: default points at a missing file"
          security default-keychain -s "$KC"
          security list-keychains -d user -s
          echo "list now:"; security list-keychains
          run "D: empty search list, default still set"
          security delete-keychain "$KC"
          echo "default after delete:"; security default-keychain
          run "E: temp keychain deleted"
