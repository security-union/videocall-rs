name: Leptos Website Build

on:
  push:
    branches: [ main ]
    paths:
      - 'leptos-website/**'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'
  pull_request:
    paths:
      - 'leptos-website/**'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  leptos-build:
    name: Leptos Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            leptos-website/target
          key: ${{ runner.os }}-cargo-leptos-${{ hashFiles('leptos-website/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-leptos-

      - name: Build Leptos website
        run: |
          nix-shell default.nix -A shells.leptos-website --run "\
            cd leptos-website && \
            npm install && \
            cargo leptos build --release"
