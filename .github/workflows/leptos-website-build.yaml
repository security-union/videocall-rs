name: Leptos Website Build

on:
  push:
    branches: [ main ]
    paths:
      - 'leptos-website/**'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'
  pull_request:
    paths:
      - 'leptos-website/**'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  leptos-build:
    name: Leptos Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            leptos-website/target
          key: ${{ runner.os }}-cargo-leptos-${{ hashFiles('leptos-website/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-leptos-

      - name: Build Leptos website
        run: |
          nix-shell default.nix -A shells.leptos-website --run "\
            cd leptos-website && \
            npm install && \
            cargo leptos build --release"
