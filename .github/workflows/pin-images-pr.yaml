name: Pin production images

# When an image publish run on main finishes, open (or refresh) one rolling
# PR that pins helm/global/us-east/* to the newest main-<sha8>@sha256 images.
# Merging that PR is the deploy: deploy-production.yaml runs on the merge.
#
# Two jobs. `plan` has a read-only token and no secrets: it builds the
# helm-image-pin tool (helm-image-pin/, configured by helm-image-pin.toml), runs it,
# and uploads the rewritten values files plus the PR title and body. `pr` has
# the write token and runs only git, gh and the shell. It treats the artifact
# as untrusted: plain files only, values files the config names, each
# differing from this checkout on exactly the tag line of the configured
# image key, with a strict new value; a one-line title; a capped body. The
# title and body reach git and gh as arguments and files, never through
# GITHUB_ENV or GITHUB_OUTPUT.
#
# Both jobs check out github.sha: the last commit on main for workflow_run,
# and the tip of main when dispatched (the jobs only run on main). Nothing
# the plan job says decides what the pr job checks out. workflow_run jobs get
# a write token, so this workflow never interpolates event data into `run:`.

on:
  workflow_run:
    workflows:
      - Publish API to Docker image
      - Publish Meeting API to Docker image
      - Publish Dioxus UI to Docker image
      - Publish Website to Docker image
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pin-images-pr
  cancel-in-progress: false

env:
  PIN_BRANCH: deploy/pin-images
  PUBLISH_WORKFLOWS: >-
    upload-api-docker-hub.yaml
    upload-meeting-api-docker-hub.yaml
    upload-dioxus-ui-docker-hub.yaml
    upload-website-docker-hub.yaml

jobs:
  plan:
    name: Resolve the newest main images
    # Dispatch only from main; workflow_run only for runs of main in this
    # repository. Failed publish runs count too: the tool only pins tags the
    # registry confirms, and skipping them would leave no PR when the last
    # sibling to finish is the one that failed.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    # Budget: gate and setup ~3 min, build <= 10 min, pin <= 5 min.
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read # see whether publish runs are still going
    outputs:
      busy: ${{ steps.gate.outputs.busy }}
    env:
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Wait for the other publish runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "triggered by: ${TRIGGER_WORKFLOW:-workflow_dispatch} ${TRIGGER_SHA:0:8} ${TRIGGER_CONCLUSION:-}"
          busy=""
          for wf in $PUBLISH_WORKFLOWS; do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main \
                  --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$n" != "0" ]; then busy="$busy $wf"; fi
          done
          if [ -n "$busy" ]; then
            # Their completion re-triggers this workflow; acting now would
            # pin a mix of old and new images.
            echo "still publishing on main:$busy. Exiting; the next completion re-runs this."
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.gate.outputs.busy == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # the tool walks main's first-parent history
          persist-credentials: false

      - name: Install Nix
        if: steps.gate.outputs.busy == 'false'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the project binary cache (pull only)
        if: steps.gate.outputs.busy == 'false'
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: videocall-rs

      - name: Build helm-image-pin
        if: steps.gate.outputs.busy == 'false'
        timeout-minutes: 10
        run: |
          nix-shell default.nix -A shells.backend-dev --run "cargo build --locked --release -p helm-image-pin"
          echo "HELM_IMAGE_PIN=$PWD/target/release/helm-image-pin" >> "$GITHUB_ENV"

      - name: Pin and stage the result
        if: steps.gate.outputs.busy == 'false'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pin"
          mkdir -p "$out/files"
          "$HELM_IMAGE_PIN" --registry-budget-secs 180 pin --report-dir "$out/report"
          git diff --name-only > "$out/changed.txt"
          while IFS= read -r file; do
            mkdir -p "$out/files/$(dirname "$file")"
            cp "$file" "$out/files/$file"
          done < "$out/changed.txt"

      - name: Upload the plan
        if: steps.gate.outputs.busy == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pin-plan
          path: ${{ runner.temp }}/pin
          if-no-files-found: error
          retention-days: 1

  pr:
    name: Open, refresh or close the PR
    needs: plan
    if: needs.plan.outputs.busy == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the rolling PR branch
      pull-requests: write # create, edit, close the PR
    steps:
      - name: Check out the same main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pin-plan
          path: ${{ runner.temp }}/pin

      # One step: what is checked here is what git and gh get, with nothing
      # passed between steps.
      - name: Check the plan, then open, refresh or close the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/pin"
          toml=helm-image-pin.toml
          fail() { echo "::error::pin plan: $*"; exit 1; }

          # Plain files only: no links, devices or fifos, nothing large.
          [ -d "$plan" ] && [ ! -L "$plan" ] && [ -f "$plan/changed.txt" ] || fail "no plan artifact"
          [ -z "$(find "$plan" -mindepth 1 ! -type f ! -type d)" ] || fail "the artifact holds something other than plain files"
          [ -z "$(find "$plan" -type f -size +64k)" ] || fail "a file in the artifact is over 64 KiB"

          # The values files and image keys the config names, in config
          # order. Every [[release]] spells both out on one line for this.
          mapfile -t values_files < <(sed -n 's|^values_file = "\([A-Za-z0-9._/-]*\)"$|\1|p' "$toml")
          mapfile -t image_keys < <(sed -n 's|^image_key = "\([A-Za-z0-9_.-]*\)"$|\1|p' "$toml")
          releases=$(grep -c '^\[\[release\]\]$' "$toml")
          [ "${#values_files[@]}" = "$releases" ] && [ "${#image_keys[@]}" = "$releases" ] ||
            fail "every [[release]] in $toml must spell out values_file and image_key on one line"

          expected=$( { printf '%s\n' changed.txt report/title.txt report/body.md
                        sed 's|^|files/|' "$plan/changed.txt"; } | sort)
          actual=$(cd "$plan" && find . -type f | sed 's|^\./||' | sort)
          if [ "$expected" != "$actual" ]; then
            diff <(echo "$expected") <(echo "$actual") || true
            fail "unexpected artifact contents"
          fi
          [ -z "$(sort "$plan/changed.txt" | uniq -d)" ] || fail "changed.txt names a file twice"

          # Do not trust the diff's shape. For each changed file, the only
          # line that may differ from this checkout is the one that holds the
          # configured image key's tag here, and its new value must be a
          # strict pin.
          while IFS= read -r file || [ -n "$file" ]; do
            key=""
            for i in "${!values_files[@]}"; do
              [ "${values_files[$i]}" = "$file" ] && key="${image_keys[$i]}"
            done
            [ -n "$key" ] || fail "plan touches '$file', which $toml does not name"
            [ -f "$file" ] && [ ! -L "$file" ] || fail "$file is not a regular file in this checkout"
            at=$(awk -v key="$key" '
              FNR == NR { old[FNR] = $0; n_old = FNR; next }
              { new[FNR] = $0; n_new = FNR }
              END {
                if (n_old != n_new) { print "the line count changed"; exit 1 }
                for (i = 1; i <= n_old; i++) if (old[i] != new[i]) { diffs++; at = i }
                if (diffs != 1) { print diffs + 0 " lines differ"; exit 1 }
                # The key path of that line, from the indentation above it.
                line = old[at]; match(line, /^ */); indent = RLENGTH
                if (line !~ /^ +tag:/) { print "line " at " is not a tag line"; exit 1 }
                path = "tag"
                for (i = at - 1; i >= 1 && indent > 0; i--) {
                  l = old[i]
                  if (l ~ /^ *(#.*)?$/) continue
                  match(l, /^ */)
                  if (RLENGTH >= indent) continue
                  if (l !~ /^ *[A-Za-z0-9_.-]+:$/) { print "line " i " is not a plain mapping key"; exit 1 }
                  k = l; sub(/^ */, "", k); sub(/:$/, "", k)
                  path = k "." path; indent = RLENGTH
                }
                if (indent != 0 || path != key ".tag") { print "line " at " is " path ", not " key ".tag"; exit 1 }
                print at
              }' "$file" "$plan/files/$file") || fail "$file: $at"
            old_line=$(sed -n "${at}p" "$file")
            new_line=$(sed -n "${at}p" "$plan/files/$file")
            pin='main-[0-9a-f]{8}@sha256:[0-9a-f]{64}'
            [[ "$new_line" =~ ^(\ +)tag:\ ($pin|\"$pin\")$ ]] || fail "$file:$at: '$new_line' is not a strict pin"
            [[ "$old_line" == "${BASH_REMATCH[1]}tag:"* ]] || fail "$file:$at: the indentation changed"
            cp "$plan/files/$file" "$file"
          done < "$plan/changed.txt"

          title=$(cat "$plan/report/title.txt")
          [[ "$title" != *[[:cntrl:]]* && "$title" =~ ^deploy:\ pin\ images\ to\ main-[0-9a-f]{8}$ ]] ||
            fail "unexpected PR title"
          printf '%s\n' "$title" | cmp -s - "$plan/report/title.txt" || fail "title.txt holds more than one line"
          body="$plan/report/body.md"
          [ "$(wc -c < "$body")" -lt 60000 ] || fail "the PR body is 60000 bytes or more"

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PIN_BRANCH" --base main \
                 --state open --json number,isCrossRepository \
                 --jq 'map(select(.isCrossRepository | not))[0].number // empty')

          if git diff --quiet -- "${values_files[@]}"; then
            echo "pins already match the newest main images"
            if [ -n "$pr" ]; then
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Closing: main already pins the newest images, so this PR has nothing left to ship."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$PIN_BRANCH"
          git add -- "${values_files[@]}"
          git commit -q -m "$title"

          # Skip the force-push when the branch already holds exactly this tree
          # on top of the same main, so reviews and the timeline stay quiet.
          if git -c http.extraheader="$auth" fetch -q "$remote" "refs/heads/$PIN_BRANCH" 2>/dev/null \
             && git diff --quiet HEAD FETCH_HEAD \
             && [ "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD^)" ]; then
            echo "$PIN_BRANCH is already up to date"
          else
            git -c http.extraheader="$auth" push -q --force "$remote" "HEAD:refs/heads/$PIN_BRANCH"
          fi

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$PIN_BRANCH" \
              --title "$title" --body-file "$body"
          fi
