name: Build PR Images (Command)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-build-images-${{ github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  check-permissions:
    name: Check permissions
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/build-images')
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
      pr_sha: ${{ steps.get-pr.outputs.pr_sha }}
      pr_ref: ${{ steps.get-pr.outputs.pr_ref }}
    steps:
      - name: Get PR details
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr_number', context.issue.number);
            core.setOutput('pr_sha', pr.data.head.sha);
            core.setOutput('pr_ref', pr.data.head.ref);
            core.setOutput('pr_repo', pr.data.head.repo.full_name);
            return pr.data;

      - name: Check if user is maintainer
        id: check
        run: |
          ASSOCIATION="${{ github.event.comment.author_association }}"
          echo "User association: $ASSOCIATION"
          if [[ "$ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            echo "✅ User is authorized"
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "❌ User is not authorized"
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: React to comment (processing)
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Comment build started
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔨 **Building PR images...**

            Started by @${{ github.event.comment.user.login }}

            Building 3 Docker images:
            - Media Server (WebSocket/WebTransport)
            - Meeting API (REST backend)
            - Dioxus UI (WASM frontend)

            ⏱️ This typically takes 5-10 minutes. I will post another comment once the build is complete.

            [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

      - name: Post error if unauthorized
        if: steps.check.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const association = '${{ github.event.comment.author_association }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Permission denied**

            @${{ github.event.comment.user.login }}, only repository maintainers can trigger image builds.

            **Your role**: \`${association}\`
            **Required roles**: \`OWNER\`, \`MEMBER\`, or \`COLLABORATOR\`

            If you believe this is an error, please ask a maintainer to run \`/build-images\` after reviewing your changes.`
            })

      - name: React to comment (unauthorized)
        if: steps.check.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            })

      - name: Fail if unauthorized
        if: steps.check.outputs.authorized == 'false'
        run: exit 1

  build-images:
    name: Build Docker images
    needs: check-permissions
    if: needs.check-permissions.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: media-server
            attr: media-server
            image: videocall-media-server
          - name: meeting-api
            attr: meeting-api
            image: videocall-meeting-api
          - name: dioxus-ui
            attr: dioxus-ui
            image: videocall-dioxus-ui
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-permissions.outputs.pr_sha }}

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-images-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-images-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # nix.dev flow: docker load < $(nix-build …) — same release.nix attrs as
      # the Docker Hub publish workflows and `make images` locally.
      - name: Build and push ${{ matrix.name }}
        run: |
          script=$(nix-build release.nix -A images.${{ matrix.attr }} --no-out-link \
            --argstr gitSha "${{ needs.check-permissions.outputs.pr_sha }}" \
            --argstr gitBranch "${{ needs.check-permissions.outputs.pr_ref }}" \
            --argstr buildTimestamp "${{ github.event.comment.created_at }}")
          "$script" | docker load
          docker tag videocall/${{ matrix.attr }}:dev ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ needs.check-permissions.outputs.pr_number }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ needs.check-permissions.outputs.pr_number }}

  comment-success:
    name: Comment with image tags
    needs: [check-permissions, build-images]
    if: needs.check-permissions.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: React to comment (success)
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Comment on PR with image tags
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.check-permissions.outputs.pr_number }};
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **PR images built successfully!**

            Triggered by @${{ github.event.comment.user.login }}

            Images pushed to GitHub Container Registry:
            - \`ghcr.io/${{ github.repository_owner }}/videocall-media-server:pr-${prNumber}\`
            - \`ghcr.io/${{ github.repository_owner }}/videocall-meeting-api:pr-${prNumber}\`
            - \`ghcr.io/${{ github.repository_owner }}/videocall-dioxus-ui:pr-${prNumber}\`

            To pull locally:
            \`\`\`bash
            docker pull ghcr.io/${{ github.repository_owner }}/videocall-media-server:pr-${prNumber}
            docker pull ghcr.io/${{ github.repository_owner }}/videocall-meeting-api:pr-${prNumber}
            docker pull ghcr.io/${{ github.repository_owner }}/videocall-dioxus-ui:pr-${prNumber}
            \`\`\`

            Comment \`/deploy\` to create a preview environment (coming soon).`
            })

  comment-failure:
    name: Comment on failure
    needs: [check-permissions, build-images]
    if: |
      always() &&
      needs.check-permissions.outputs.authorized == 'true' &&
      needs.build-images.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: React to comment (failure)
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            })

      - name: Comment on failure
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.check-permissions.outputs.pr_number }};
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Build failed**

            Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            })
