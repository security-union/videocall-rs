name: Publish Engineering Vlog to Docker image

on:
  pull_request:
    paths:
      - 'engineering-vlog/**'
      - 'nix/images/engineering-vlog.nix'
      - '.github/workflows/upload-engineering-vlog-docker-hub.yaml'
  push:
    branches:
      - main
    paths:
      - 'engineering-vlog/**'
      - 'nix/images/engineering-vlog.nix'
      - '.github/workflows/upload-engineering-vlog-docker-hub.yaml'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Engineering Vlog Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # PRs: build only (validates the derivation). Pushes to main: publish.
      - name: Build Engineering Vlog image
        run: |
          script=$(nix-build release.nix -A images.engineering-vlog --no-out-link)
          echo "script=$script" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          "$script" | docker load
          sha8=$(echo ${GITHUB_SHA::8})
          docker tag videocall/engineering-vlog:dev securityunion/videocall-engineering-vlog:main-$sha8
          docker tag videocall/engineering-vlog:dev securityunion/videocall-engineering-vlog:latest
          docker push securityunion/videocall-engineering-vlog:main-$sha8
          docker push securityunion/videocall-engineering-vlog:latest
