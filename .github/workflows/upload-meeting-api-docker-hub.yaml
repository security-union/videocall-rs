name: Publish Meeting API to Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'meeting-api/**'
      - 'videocall-meeting-types/**'
      - 'dbmate/**'
      - Cargo.lock
      - Cargo.toml
      - default.nix
      - release.nix
      - 'nix/**'

jobs:
  push_to_registry:
    name: Push Meeting API Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        id: checkout

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        with:
          # one cache entry per pins+lockfile state — a single tar, immune to
          # the per-path API throttling that killed magic-nix-cache
          primary-key: nix-images-${{ runner.os }}-${{ hashFiles('nix/tamal/lock.json', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-images-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract SHA
        id: extract_sha
        run: echo "sha8=$(echo ${GITHUB_SHA::8})" >> "$GITHUB_OUTPUT"

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=$(echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}} | sed 's/\//-/g')" >> "$GITHUB_OUTPUT"

      # nix.dev flow: docker load < $(nix-build …) — the same release.nix attr
      # `make image-meeting-api` builds locally.
      - name: Build and push Meeting API Docker image
        run: |
          script=$(nix-build release.nix -A images.meeting-api --no-out-link \
            --argstr gitSha "${{ steps.extract_sha.outputs.sha8 }}" \
            --argstr gitBranch "${{ steps.extract_branch.outputs.branch }}" \
            --argstr buildTimestamp "${{ github.event.head_commit.timestamp }}")
          "$script" | docker load
          docker tag videocall/meeting-api:dev securityunion/videocall-meeting-api:${{ steps.extract_branch.outputs.branch }}-${{ steps.extract_sha.outputs.sha8 }}
          docker tag videocall/meeting-api:dev securityunion/videocall-meeting-api:latest
          docker push securityunion/videocall-meeting-api:${{ steps.extract_branch.outputs.branch }}-${{ steps.extract_sha.outputs.sha8 }}
          docker push securityunion/videocall-meeting-api:latest
