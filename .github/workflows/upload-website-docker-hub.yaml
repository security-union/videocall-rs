name: Publish Website to Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'leptos-website/**'
      - 'nix/images/website.nix'
      - 'nix/packages.nix'
      - 'nix/**'
      - default.nix
      - release.nix

jobs:
  build_and_push:
    name: Build and Push Website Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # nix.dev flow: docker load < $(nix-build …) — same release.nix attr as
      # `make image-website` locally.
      - name: Build and push Website Docker image
        run: |
          script=$(nix-build release.nix -A images.website --no-out-link)
          "$script" | docker load
          sha8=$(echo ${GITHUB_SHA::8})
          branch=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
          docker tag videocall/website:dev securityunion/video-call-rs-website:$branch-$sha8
          docker tag videocall/website:dev securityunion/video-call-rs-website:latest
          docker push securityunion/video-call-rs-website:$branch-$sha8
          docker push securityunion/video-call-rs-website:latest
