name: WebAssembly Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'dioxus-ui/**'
      - '.github/workflows/wasm-test.yaml'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'
  pull_request:
    paths:
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'dioxus-ui/**'
      - '.github/workflows/wasm-test.yaml'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  wasm-test:
    name: WebAssembly Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Run wasm-pack tests for videocall-client
        run: nix-shell default.nix -A shells.wasm-tests --run "cd videocall-client && wasm-pack test --node"

      - name: Run tests for videocall-codecs (default, C-free)
        run: nix-shell default.nix -A shells.wasm-tests --run "cd videocall-codecs && cargo test"

      - name: Run oracle tests for videocall-codecs (libvpx)
        run: nix-shell default.nix -A shells.wasm-tests --run 'cargo test -p videocall-codecs --features "libvpx test-utils"'

      - name: Run tests for neteq
        run: nix-shell default.nix -A shells.wasm-tests --run "cd neteq && cargo test --no-default-features --features web"

      - name: Run dioxus-ui capture polyfill tests (node)
        run: nix-shell default.nix -A shells.wasm-tests --run "node --test dioxus-ui/tests/js/track-processor.test.cjs"

  dioxus-ui-component-tests:
    name: Dioxus UI Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dioxus-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-tests-

      # Google's apt pool only hosts the current stable google-chrome .deb,
      # so a nix-pinned Chrome stops downloading on every Chrome release.
      # Install current stable Chrome and the matching chromedriver instead;
      # the script checks their major versions agree.
      - name: Install Chrome and chromedriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run dioxus-ui component tests
        # All logic (browser/driver version check, per-binary retry, wedged
        # Chrome cleanup) lives in nix/dioxus-ui-component-tests.sh, packaged
        # and shellchecked via writeShellApplication (nix/shells.nix).
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: nix-shell default.nix -A shells.frontend-tests --run dioxus-ui-component-tests
