name: WebAssembly Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'dioxus-ui/**'
      - '.github/workflows/wasm-test.yaml'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'
  pull_request:
    paths:
      - 'videocall-client/**'
      - 'videocall-codecs/**'
      - 'neteq/**'
      - 'videocall-types/**'
      - 'protobuf/**'
      - 'dioxus-ui/**'
      - '.github/workflows/wasm-test.yaml'
      - 'default.nix'
      - 'release.nix'
      - 'nix/**'

jobs:
  wasm-test:
    name: WebAssembly Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          # pull works tokenless (public cache); push activates once the
          # CACHIX_AUTH_TOKEN repo secret exists
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Run wasm-pack tests for videocall-client
        run: nix-shell default.nix -A shells.wasm-tests --run "cd videocall-client && wasm-pack test --node"

      - name: Run tests for videocall-codecs (default, C-free)
        run: nix-shell default.nix -A shells.wasm-tests --run "cd videocall-codecs && cargo test"

      - name: Run oracle tests for videocall-codecs (libvpx)
        run: nix-shell default.nix -A shells.wasm-tests --run 'cargo test -p videocall-codecs --features "libvpx test-utils"'

      - name: Run tests for neteq
        run: nix-shell default.nix -A shells.wasm-tests --run "cd neteq && cargo test --no-default-features --features web"

  dioxus-ui-component-tests:
    name: Dioxus UI Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: videocall-rs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dioxus-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-tests-

      - name: Remove the runner's stock Chrome and chromedriver
        run: |
          # The browser for the wasm component tests is nix-pinned
          # (google-chrome + matching chromedriver from the nix/tamal nixpkgs
          # pin). Delete the runner image's auto-updating Chrome/chromedriver
          # so any fallback to them fails loudly instead of silently unpinning.
          sudo rm -rf /opt/google/chrome
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable
          stock_driver="$(command -v chromedriver || true)"
          if [ -n "${stock_driver}" ]; then
            sudo rm -f "${stock_driver}"
          fi

      - name: Run dioxus-ui component tests
        # All logic (pinned-browser verification, per-binary retry, wedged
        # Chrome cleanup) lives in nix/dioxus-ui-component-tests.sh, packaged
        # and shellchecked via writeShellApplication (nix/shells.nix).
        run: nix-shell default.nix -A shells.frontend-tests --run dioxus-ui-component-tests
