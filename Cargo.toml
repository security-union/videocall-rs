[workspace]
resolver = "2"
members = [
    "actix-api",
    "meeting-api",
    "bot",
    "videocall-types",
    "videocall-meeting-types",
    "videocall-meeting-client",
    "videocall-aq",
    "videocall-netsim",
    "videocall-client",
    "videocall-cli",
    "dioxus-ui",
    "videocall-sdk",
    "videocall-codecs",
    "neteq",
    "videocall-diagnostics",
    "videocall-transport",
    "vcprobe"
]

exclude = [
    "src-tauri",
    "leptos-website",
    "videocall-cli/nokhwa",
    "videocall-cli/nokhwa/nokhwa-bindings-macos",
    "videocall-cli/nokhwa/nokhwa-bindings-windows",
    "videocall-cli/nokhwa/nokhwa-bindings-linux",
    "videocall-cli/nokhwa/nokhwa-core",
    "vendor/quinn-proto",
    "vendor/quinn",
    "vendor/web-transport-quinn"
]

[workspace.dependencies]
env-libvpx-sys = { version = "5.1.3", features = ["generate"] }
anyhow = "1.0.75"
wasm-bindgen-futures = { version = "0.4.30" }
wasm-bindgen = "0.2.108"
web-transport-quinn = "0.11.9"
# Compile-time embedded Unicode emoji table (no_std, wasm-compatible). Backs the
# CUSTOM reaction picker + its exact-emoji validation allowlist (issue 1884).
emojis = "0.9"

# Vendored from crates.io to carry the issue 3116 send-reserve patch; a [patch] applies to
# every workspace crate that depends on these (actix-api, bot, vcprobe, videocall-cli, videocall-sdk).
[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }
quinn = { path = "vendor/quinn" }
web-transport-quinn = { path = "vendor/web-transport-quinn" }
