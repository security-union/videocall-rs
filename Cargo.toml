[workspace]
resolver = "2"
members = [
    "actix-api",
    "meeting-api",
    "bot",
    "videocall-types",
    "videocall-meeting-types",
    "videocall-meeting-client",
    "videocall-client",
    "videocall-cli",
    "dioxus-ui",
    "videocall-sdk",
    "videocall-codecs",
    "neteq",
    "videocall-diagnostics",
    "videocall-transport",
    "matomo-logger"
]

exclude = [
    "src-tauri",
    "leptos-website",
    "videocall-cli/nokhwa",
    "videocall-cli/nokhwa/nokhwa-bindings-macos",
    "videocall-cli/nokhwa/nokhwa-bindings-windows",
    "videocall-cli/nokhwa/nokhwa-bindings-linux",
    "videocall-cli/nokhwa/nokhwa-core"
]

[workspace.dependencies]
env-libvpx-sys = { version = "5.1.3", features = ["generate"] }
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1.0.75"
wasm-bindgen-futures = { version = "0.4.80" }
wasm-bindgen = "0.2.130"
web-transport-quinn = "0.8.1"

# Release profile for the microphone encoder worker only (dioxus-ui/index.html
# selects it with data-cargo-profile-release). Size beats speed here: the
# worker is downloaded on every page load and encodes 50 frames a second, a
# light load. Other crates and workers keep the default release profile.
[profile.audio-worker-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
