# Docker synthetic clients configuration.
# Participants come from `conversation/manifest.yaml`, not from this file.
ramp_up_delay_ms: 1000
server_url: "https://webtransport-api:4433"
insecure: true  # Skip certificate verification for development
meeting_id: "meetinga"

# This service and webtransport-api read the same JWT_SECRET, so the bot mints
# its own room token. `allow_deprecated_path` is the fallback consulted only
# when no secret is configured (see mint::resolve_lobby_auth).
allow_deprecated_path: true
