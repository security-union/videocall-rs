##
## E2E test stack — app services are Nix-built images (release.nix), the same
## derivations CI publishes. Build/load them first: `make e2e-build`.
## Starts the minimum services needed for Playwright E2E tests.
## dioxus-ui (port 3001).
##
## Usage:
##   make e2e-build
##   docker compose -p videocall-e2e -f docker/docker-compose.e2e.yaml up -d
##   cd e2e && npx playwright test
##   docker compose -p videocall-e2e -f docker/docker-compose.e2e.yaml down -v
##
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: "docker"
      PGPASSWORD: "docker"
      POSTGRES_DB: "actix-api-db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "--http_port", "8222"]

  meeting-api:
    image: videocall/meeting-api:dev
    environment:
      - LISTEN_ADDR=0.0.0.0:8081
      - DATABASE_URL=postgres://postgres:docker@postgres:5432/actix-api-db?sslmode=disable
      - JWT_SECRET=dev-jwt-secret-change-me
      - TOKEN_TTL_SECS=60
      - SESSION_TTL_SECS=315360000
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=
      - CORS_ALLOWED_ORIGIN=
      - OAUTH_CLIENT_ID=
      - OAUTH_SECRET=
      - OAUTH_REDIRECT_URL=
      - OAUTH_ISSUER=
      - OAUTH_AUTH_URL=
      - OAUTH_TOKEN_URL=
      - OAUTH_JWKS_URL=
      - OAUTH_USERINFO_URL=
      - AFTER_LOGIN_URL=http://localhost:3001
      - ALLOWED_REDIRECT_URLS=http://localhost:3001
      - NATS_URL=nats:4222
      - RUST_LOG=info
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  websocket-api:
    image: videocall/websocket-server:dev
    environment:
      - ACTIX_PORT=8080
      - UI_ENDPOINT=http://localhost:3001
      - DATABASE_ENABLED=false
      - RUST_LOG=info
      - NATS_URL=nats:4222
      - REGION=us-east
      - SERVER_ID=server-1
      - SERVICE_TYPE=websocket
      - FEATURE_MEETING_MANAGEMENT=true
      - JWT_SECRET=dev-jwt-secret-change-me
      - LOGIN_URL=
      - ACTIX_UI_BACKEND_URL=
      - WEBTRANSPORT_HOST=
    ports:
      - "8080:8080"
    depends_on:
      - nats

  dioxus-ui:
    image: videocall/dioxus-ui:dev
    environment:
      - ACTIX_UI_BACKEND_URL=ws://localhost:8080
      - WEBTRANSPORT_HOST=https://127.0.0.1:4433
      - ENABLE_OAUTH=false
      - API_BASE_URL=http://localhost:8081
      - LOGIN_URL=http://localhost:8081/login
      - WEBTRANSPORT_ENABLED=false
      - E2EE_ENABLED=false
      - FIREFOX_ENABLED=false
      - USERS_ALLOWED_TO_STREAM=
      - OAUTH_PROVIDER=google
      - UI_URL=http://localhost:3001
    ports:
      - "3001:80"
