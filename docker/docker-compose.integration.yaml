##
## Middleware for the Rust integration tests. The tests themselves run
## natively on the host (`make tests_run`) inside the pinned nix-shell —
## there is no test container anymore.
##
services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: "docker"
      PGPASSWORD: "docker"
      POSTGRES_DB: "actix-api-db"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "--http_port", "8222"]
    ports:
      - "4222:4222"
