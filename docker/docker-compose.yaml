##
## Full CONTAINER stack from Nix-built images (see release.nix) — there are no
## Dockerfiles and no `build:` sections. `make up` builds/loads the images and
## starts everything here.
##
## This is NOT the dev loop: `make dev` runs the whole stack natively (no
## Docker at all) under process-compose — see nix/dev-stack.nix.
##
services:
  dioxus-ui:
    image: videocall/dioxus-ui:dev
    environment:
      - ACTIX_UI_BACKEND_URL=${ACTIX_UI_BACKEND_URL:-ws://localhost:${ACTIX_PORT:-8080}}
      - WEBTRANSPORT_HOST=${WEBTRANSPORT_HOST:-https://127.0.0.1:4433}
      - ENABLE_OAUTH=${ENABLE_OAUTH:-false}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8081}
      - LOGIN_URL=http://localhost:8081/login
      - WEBTRANSPORT_ENABLED=${WEBTRANSPORT_ENABLED:-false}
      - E2EE_ENABLED=${E2EE_ENABLED:-false}
      - FIREFOX_ENABLED=${FIREFOX_ENABLED:-false}
      - USERS_ALLOWED_TO_STREAM=${USERS_ALLOWED_TO_STREAM:-}
      - OAUTH_PROVIDER=${OAUTH_PROVIDER:-google}
      - UI_URL=${UI_URL:-http://localhost:${DIOXUS_SERVE_PORT:-3001}}
    ports:
      - "${DIOXUS_SERVE_PORT:-3001}:80"

  # NOTE: the leptos marketing site has no nix image yet (Stage 3 of the nix
  # migration); hack on it natively with `make dev-website` (port 4600).

  meeting-api:
    image: videocall/meeting-api:dev
    environment:
      - LISTEN_ADDR=0.0.0.0:8081
      - DATABASE_URL=postgres://postgres:docker@postgres:5432/actix-api-db?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - TOKEN_TTL_SECS=${TOKEN_TTL_SECS:-60}
      - SESSION_TTL_SECS=${SESSION_TTL_SECS:-315360000}
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:8081/login/callback}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_AUTH_URL=${OAUTH_AUTH_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_JWKS_URL=${OAUTH_JWKS_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid email profile}
      - AFTER_LOGIN_URL=${AFTER_LOGIN_URL:-http://localhost:${DIOXUS_SERVE_PORT:-3001}}
      - ALLOWED_REDIRECT_URLS=${ALLOWED_REDIRECT_URLS:-http://localhost:${DIOXUS_SERVE_PORT:-3001}}
      - NATS_URL=nats:4222
      - RUST_LOG=debug
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - nats

  websocket-api:
    image: videocall/websocket-server:dev
    environment:
      - ACTIX_PORT=${ACTIX_PORT:-8080}
      - UI_ENDPOINT=${UI_ENDPOINT:-http://localhost:3001}
      - DATABASE_ENABLED=false
      - RUST_LOG=debug,async_nats=info
      - NATS_URL=nats:4222
      - REGION=${REGION:-us-east}
      - SERVER_ID=${SERVER_ID:-server-1}
      - SERVICE_TYPE=websocket
      - LOGIN_URL=""
      - ACTIX_UI_BACKEND_URL=""
      - WEBTRANSPORT_HOST=""
      - FEATURE_MEETING_MANAGEMENT=${FEATURE_MEETING_MANAGEMENT:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
    ports:
      - "${ACTIX_PORT:-8080}:${ACTIX_PORT:-8080}"
    depends_on:
      - nats

  metrics-api:
    image: videocall/metrics-server:dev
    environment:
      - METRICS_PORT=9091
      - NATS_URL=nats:4222
      - REGION=${REGION:-us-east}
      - SERVER_ID=${SERVER_ID:-server-1}
      - SERVICE_TYPE=client-metrics
      - RUST_LOG=debug,async_nats=info
      - DATABASE_URL=postgres://postgres:docker@postgres:5432/actix-api-db?sslmode=disable
    ports:
      - "9091:9091"
    depends_on:
      - nats

  server-stats-api:
    image: videocall/server-stats:dev
    environment:
      - METRICS_PORT=9092
      - NATS_URL=nats:4222
      - REGION=${REGION:-us-east}
      - SERVER_ID=${SERVER_ID:-server-1}
      - SERVICE_TYPE=server-stats
      - RUST_LOG=debug,async_nats=info
    ports:
      - "9092:9092"
    depends_on:
      - nats

  webtransport-api:
    image: videocall/webtransport-server:dev
    environment:
      - RUST_LOG=info
      - NATS_URL=nats:4222
      - REGION=${REGION:-us-east}
      - SERVER_ID=${SERVER_ID:-server-1}
      - SERVICE_TYPE=webtransport
      - LISTEN_URL=0.0.0.0:4433
      - HEALTH_LISTEN_URL=0.0.0.0:5321
      - CERT_PATH=/certs/localhost.pem
      - KEY_PATH=/certs/localhost.key
      - FEATURE_MEETING_MANAGEMENT=${FEATURE_MEETING_MANAGEMENT:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
    ports:
      - "4433:4433/udp"
    volumes:
      - type: bind
        source: ../actix-api/certs
        target: /certs
        read_only: true
    depends_on:
      - nats

  synthetic-clients:
    image: videocall/bot:dev
    environment:
      - RUST_LOG=debug
      - BOT_CONFIG_PATH=/config/bot-config.yaml
      - INSECURE=true
    volumes:
      - type: bind
        source: ./bot-config.yaml
        target: /config/bot-config.yaml
        read_only: true
    depends_on:
      - webtransport-api

  nats:
    image: nats
    command: "--http_port 8222"
    ports:
      - "4222:4222"
      - "8222:8222"

  nats-box:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    environment:
      - NATS_URL=nats:4222
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: "docker"
      PGPASSWORD: "docker"
      POSTGRES_DB: "actix-api-db"
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus:latest
    container_name: videocall-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: videocall-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  prometheus_data:
  grafana_data:
