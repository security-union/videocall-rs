# Singapore WebTransport server configuration
rustlemania-webtransport:
  nameOverride: "webtransport-singapore"
  fullnameOverride: "webtransport-singapore"

  replicaCount: 1

  command: ['webtransport_server']
  tlsSecret: webtransport-singapore-tls
  
  image:
    repository: securityunion/videocall-media-server
    pullPolicy: Always
    tag: latest

  env:
    - name: RUST_LOG
      value: warn,quinn=warn,async_nats=warn
    - name: NATS_URL
      value: nats-singapore:4222  # Connect to Singapore NATS cluster
    - name: LISTEN_URL
      value: 0.0.0.0:443
    - name: HEALTH_LISTEN_URL
      value: 0.0.0.0:444
    - name: CERT_PATH
      value: /certs/tls.crt
    - name: KEY_PATH
      value: /certs/tls.key
    - name: REGION
      value: "singapore"
    - name: HOSTNAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SERVER_ID
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SERVICE_TYPE
      value: webtransport
    - name: SERVER_STATS_INTERVAL_SECS
      value: "5"
    - name: MEMBERSHIP_MIRROR_ENABLED
      value: "true"
    # TOKIO_WORKER_THREADS stays omitted, and MUST: tokio DOES read it for the
    # multi-threaded runtime #2727 builds and PANICS on 0 or garbage (the relay
    # passes its pool size explicitly). WT_SESSION_ARBITERS is the knob.
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: jwt-secret
          key: secret

  # available_parallelism() FLOORS the quota, so 1000m gives one arbiter: the
  # un-sharded posture (#2727). Raise in WHOLE cores to shard.
  resources:
    limits:
      cpu: "1000m"
      memory: "1400Mi"
    requests:
      cpu: "1000m"
      memory: "1400Mi"

  service:
    type: LoadBalancer  # LoadBalancer for UDP traffic
    port: 443
    healthPort: 444
    # Pinned to match ../../us-east/webtransport/values.yaml; see the note there.
    externalTrafficPolicy: Cluster
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 86400

  # ROLLOUT: first application, so do-loadbalancer-type likely recreates the balancer
  # with a NEW IP. Apply before ../websocket/certificate.yaml, whose SAN needs external-dns.
  loadBalancerAnnotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "webtransport-singapore"
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "10"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-response-timeout-seconds: "5"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-unhealthy-threshold: "3"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "444"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/healthz"
    external-dns.alpha.kubernetes.io/hostname: "webtransport-singapore.webtransport.video"

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "444"
    prometheus.io/path: "/metrics"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  # Node selector for Singapore region
  nodeSelector:
    topology.kubernetes.io/region: "sgp1"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - webtransport-singapore
          topologyKey: kubernetes.io/hostname 
