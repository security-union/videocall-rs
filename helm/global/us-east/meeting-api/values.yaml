# US East Meeting API configuration
meeting-api:
  nameOverride: "meeting-api-us-east"
  fullnameOverride: "meeting-api-us-east"

  replicaCount: 1

  image:
    repository: securityunion/videocall-meeting-api
    pullPolicy: Always
    tag: latest

  env:
    - name: RUST_LOG
      value: info
    - name: LISTEN_ADDR
      value: "0.0.0.0:8081"
    - name: PG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-credentials
          key: password
    - name: DATABASE_URL
      value: postgres://postgres:$(PG_PASSWORD)@postgres-postgresql:5432/actix-api-db?sslmode=disable
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: jwt-secret
          key: secret
    - name: TOKEN_TTL_SECS
      value: "86400"
    # #1750/#1966: idle/re-mint increment (7d), not total session length —
    # active sessions slide up to SESSION_ABSOLUTE_MAX_SECS.
    - name: SESSION_TTL_SECS
      value: "604800"
    # #1966: hard absolute cap (30d). MUST exceed SESSION_TTL_SECS or sliding
    # refresh is a no-op.
    - name: SESSION_ABSOLUTE_MAX_SECS
      value: "2592000"
    - name: COOKIE_SECURE
      value: "true"
    - name: COOKIE_DOMAIN
      value: ".videocall.rs"
    - name: CORS_ALLOWED_ORIGIN
      value: "https://app.videocall.rs"
    # --- OAuth / OIDC ---
    - name: OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: google-oauth-credentials
          key: client-id
          optional: true
    - name: OAUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: google-oauth-credentials
          key: client-secret
          optional: true
    - name: OAUTH_ISSUER
      value: "https://accounts.google.com"
    - name: OAUTH_REDIRECT_URL
      value: "https://api.videocall.rs/login/callback"
    - name: OAUTH_SCOPES
      value: "openid email profile"
    - name: AFTER_LOGIN_URL
      value: "https://app.videocall.rs"
    - name: ALLOWED_REDIRECT_URLS
      value: "https://app.videocall.rs"
    - name: SERVICE_VERSION_URLS
      value: "http://websocket-us-east:8080/version,http://webtransport-us-east-lb:444/version,http://videocall-ui-us-east:80/version.json"

  # Argon2 meeting-password verification (issue #1613) is CPU-bound and runs on
  # tokio's blocking pool. Below 1000m the cgroup quota makes
  # `available_parallelism()` floor to 1 (Rust computes quota/period with integer
  # division, then `.max(1)`), which pins the tokio runtime to a single worker
  # thread and caps the verifier at one permit. 1000m gives the runtime real
  # parallelism; memory is unchanged because the verifier's peak is bounded by
  # its semaphore (<=4 permits x ~19 MiB), not by the CPU limit.
  resources:
    limits:
      cpu: "1000m"
      memory: "256Mi"
    requests:
      cpu: "250m"
      memory: "128Mi"

  service:
    type: ClusterIP
    port: 8081

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: api.videocall.rs
        paths:
          - path: /
            pathType: Prefix
            service:
              name: meeting-api-us-east
              port:
                number: 8081
    tls:
      - secretName: api-videocall-rs-tls
        hosts:
          - api.videocall.rs

  nodeSelector:
    topology.kubernetes.io/region: "nyc1"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - meeting-api-us-east
          topologyKey: kubernetes.io/hostname
