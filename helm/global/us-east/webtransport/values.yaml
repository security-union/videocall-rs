# US East WebTransport server configuration
rustlemania-webtransport:
  nameOverride: "webtransport-us-east"
  fullnameOverride: "webtransport-us-east"

  replicaCount: 1

  command: ['webtransport_server']
  tlsSecret: webtransport-us-east-tls

  image:
    repository: securityunion/videocall-media-server
    pullPolicy: Always
    tag: latest

  env:
    - name: RUST_LOG
      value: warn,quinn=warn,web-transport-quinn=warn,async_nats=warn
    - name: NATS_URL
      value: nats-us-east:4222
    - name: LISTEN_URL
      value: 0.0.0.0:443
    - name: HEALTH_LISTEN_URL
      value: 0.0.0.0:444
    - name: CERT_PATH
      value: /certs/tls.crt
    - name: KEY_PATH
      value: /certs/tls.key
    - name: REGION
      value: "us-east"
    - name: HOSTNAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SERVER_ID
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SERVICE_TYPE
      value: webtransport
    - name: SERVER_STATS_INTERVAL_SECS
      value: "5"
    - name: MEMBERSHIP_MIRROR_ENABLED
      value: "true"
    # TOKIO_WORKER_THREADS stays omitted, and MUST: tokio DOES read it for the
    # multi-threaded runtime #2727 builds and PANICS on 0 or garbage (the relay
    # passes its pool size explicitly). WT_SESSION_ARBITERS is the knob.
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: jwt-secret
          key: secret

  # available_parallelism() FLOORS the quota, so 3500m gives 3 cores (#2727) and
  # the trailing 500m is unusable. Rounding to 4000m is an ops decision.
  resources:
    limits:
      cpu: "3500m"
      memory: "6000Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

  service:
    type: LoadBalancer
    port: 443
    healthPort: 444
    # Local belongs here once the #1202 guard lifts; at one replica it only costs
    # a 10-15s partial-loss window per reschedule, from the thresholds set below.
    externalTrafficPolicy: Cluster
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 86400

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "444"
    prometheus.io/path: "/metrics"

  # LB annotations — must be under loadBalancerAnnotations (not service.annotations)
  # as that's what the loadbalancer.yaml template reads.
  loadBalancerAnnotations:
    external-dns.alpha.kubernetes.io/hostname: "webtransport-us-east.webtransport.video"
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "5"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-response-timeout-seconds: "3"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-unhealthy-threshold: "3"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "444"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/healthz"

  nodeSelector:
    topology.kubernetes.io/region: "nyc1"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - webtransport-us-east
          topologyKey: kubernetes.io/hostname
