apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meeting-api.fullname" . }}
  labels:
    {{- include "meeting-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "meeting-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "meeting-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "meeting-api.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
            {{- /*
              Device login settings derived from the ingress, so deployments that
              replace the whole `env` list (PR previews pass --set env[N]) still
              get them. An explicit entry in `env` always wins.
            */}}
            {{- $envNames := list }}
            {{- range .Values.env }}{{- $envNames = append $envNames .name }}{{- end }}
            {{- if and .Values.ingress.enabled .Values.ingress.hosts }}
            {{- if not (has "DEVICE_TOKEN_AUDIENCE" $envNames) }}
            - name: DEVICE_TOKEN_AUDIENCE
              value: {{ printf "%s://%s" (ternary "https" "http" (not (empty .Values.ingress.tls))) (index .Values.ingress.hosts 0).host | quote }}
            {{- end }}
            {{- if not (has "TRUST_X_FORWARDED_FOR" $envNames) }}
            - name: TRUST_X_FORWARDED_FOR
              value: "true"
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
