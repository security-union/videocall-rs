apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meeting-api.fullname" . | trunc 48 | trimSuffix "-" }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "meeting-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # No hook-failed: a failed Job is kept so its log can be read.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meeting-api.name" . | trunc 55 | trimSuffix "-" }}-migrate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/dbmate/startup.sh"]
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
            - name: PGOPTIONS
              value: "-c lock_timeout=5s"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
