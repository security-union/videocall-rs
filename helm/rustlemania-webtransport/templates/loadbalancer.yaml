apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustlemania.fullname" . }}-lb
  labels:
    {{- include "rustlemania.labels" . | nindent 4 }}
  {{- if .Values.loadBalancerAnnotations}}
  annotations:
  {{- range $key, $value := .Values.loadBalancerAnnotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if eq (.Values.service.sessionAffinity | default "None") "ClientIP" }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ int .Values.service.sessionAffinityTimeoutSeconds }}
  {{- else }}
  sessionAffinity: {{ .Values.service.sessionAffinity | default "None" }}
  {{- end }}
  selector:
    {{- include "rustlemania.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.healthPort }}
      targetPort: {{ .Values.service.healthPort }}
      name: wt-api-health
      {{- if .Values.service.healthNodePort }}
      nodePort: {{ .Values.service.healthNodePort }}
      {{- end }}
    - protocol: UDP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: wt-api
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
