# Default values for rustlemania-webtransport.
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
image:
  repository: securityunion/videocall-media-server
  pullPolicy: Always
  tag: latest
imagePullSecrets: []
command: ['webtransport_server']
args: []
tlsSecret: webtransport-tls
env:
  - name: RUST_LOG
    value: warn,quinn=warn
  - name: NATS_URL
    value: nats:4222
  - name: LISTEN_URL
    value: 0.0.0.0:443
  - name: HEALTH_LISTEN_URL
    value: 0.0.0.0:444
  - name: CERT_PATH
    value: /certs/tls.crt
  - name: KEY_PATH
    value: /certs/tls.key
  - name: REGION
    value: "default"
  - name: HOSTNAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: SERVER_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: SERVICE_TYPE
    value: webtransport
  - name: SERVER_STATS_INTERVAL_SECS
    value: "5"
  # TOKIO_WORKER_THREADS stays unset, and MUST: the #2727 sharded relay is
  # multi-threaded, where tokio DOES read it and PANICS on 0 or garbage (the
  # relay passes its pool size explicitly, which is what makes it ignored).
  # WT_SESSION_ARBITERS is the knob; see docs/DEPLOYMENT_CONFIG_MAP.md.

  # WT outbound mpsc capacity per session. Default in code is 1024
  # (fail-fast per issue #979: a deep queue only buffers stale, useless
  # video for slow receivers — the priority-drop policy + CONGESTION
  # feedback are the correct response, not a bigger buffer; #2717 bounds
  # the camera/screen backlog in BYTES rather than by a shallower slot
  # count). Override here only for exceptional workloads.
  #
  # Shedding is NOT env-tunable: the priority-drop policy lives in
  # actix-api/src/actors/priority_drop.rs and uses fixed fill ratios
  # (video/screen shed at 0.80, audio at 0.95, control/critical never
  # preempted). There is no WT_OUTBOUND_SHEDDING_THRESHOLD env var — the
  # old dead var was removed in #731.
  # - name: WT_OUTBOUND_CHANNEL_CAPACITY
  #   value: "1024"
  #
  # Which QUIC primitive carries downlink audio to a ds=1 receiver (#2724).
  # Code default is "reliable": audio gets a dedicated reliable stream, so loss
  # is recovered in about one RTT instead of concealed and the recurring
  # sub-second hitches of #1878 go away. A multi-second stall is still heard as
  # a gap -- NetEq caps its target at 300 ms and flushes above 1000 ms, so it
  # discards the backlog. Set "datagram" to revert this cluster to the
  # pre-#2724 route. Read once at startup, so a change needs a pod restart.
  # Pre-#2723 clients keep datagram audio either way. Confirm which way a
  # cluster is running with
  # videocall_relay_wt_audio_downlink_sessions_total{lane,mode}.
  # - name: WT_AUDIO_DOWNLINK_LANE
  #   value: "reliable"
  # JWT_SECRET must match the secret used by meeting-api to sign room access tokens.
  # Create the secret with: kubectl create secret generic jwt-secret --from-literal=secret=<value>
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: secret
  # Off => the relay accepts a tokenless join as any identity into any room
  # (#2298). Deploy workflows replace this whole list via `--set env[N]`, so
  # they must set this var too; this default only covers a bare chart install.
  - name: FEATURE_MEETING_MANAGEMENT
    value: "true"
resources:
  # limits.cpu MUST be WHOLE cores (#2727): available_parallelism() floors the
  # cgroup quota, so "1500m" reports ONE core and disables sharding.
  # Memory: the 60 MiB observed 7d peak is TYPICAL occupancy, not
  # the bound. The bound is ~15.6 MiB per receiver (#2717 byte shed plus the
  # datagram lane and mailbox), so ~470 MiB at 30 sessions: 512Mi is the
  # bound, NOT headroom. #2715 gives the HCL relays 2Gi via --set, so size
  # per cluster rather than trusting this default. The byte bound is keyed
  # off the cleartext outer media_kind, so a publisher that leaves it unset
  # under E2EE is bounded only by slots x MAX_FRAME_SIZE.
  limits:
    cpu: "2000m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "32Mi"
# /healthz is 503 while the relay's actix_rt heartbeat is stale past 2000 ms.
readinessProbe:
  httpGet:
    path: /healthz
    port: wt-api-health
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 3
# Restarts a pod stalled ~1 min; every session on it drops. RELAY_HEALTH_STALE_MS tunes it.
livenessProbe:
  httpGet:
    path: /healthz
    port: wt-api-health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6
  terminationGracePeriodSeconds: 10
terminationGracePeriodSeconds: 30
# Dormant: templates/pdb.yaml renders only above one replica, which the #1202
# guard in templates/validate-values.yaml forbids. It returns with the guard.
podDisruptionBudget:
  minAvailable: 1
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "444"
  prometheus.io/path: "/metrics"
podSecurityContext: {}
securityContext: {}
service:
  type: NodePort
  port: 443
  healthPort: 444
  # Cluster while the #1202 guard holds; flip to Local with it, not before. 86400
  # is MaxClientIPServiceAffinitySeconds. docs/hcl-daily-operations.md section 4.
  externalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 86400
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
# Soft anti-affinity so the replicas of a single 30-person meeting do
# not all land on the same node. `preferred` (not `required`) so a
# small cluster with fewer nodes than replicas still schedules.
#
# The selector value matches the chart's `app.kubernetes.io/name`
# label as defined in `_helpers.tpl` -> `rustlemania.selectorLabels`,
# which defaults to the chart name `rustlemania-webtransport`.
# Override `nameOverride` in values to match if you change the chart.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rustlemania-webtransport
          topologyKey: kubernetes.io/hostname
loadBalancerAnnotations: {}
