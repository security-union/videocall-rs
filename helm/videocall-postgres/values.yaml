# Shared defaults only. Cluster-specific values go in the cluster's file -- see README.

postgresql:
  auth:
    database: ""
    enablePostgresUser: true
    existingSecret: postgres-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
    username: postgres

  # Must stay empty: the subchart's `latest` default would otherwise satisfy the schema.
  image:
    tag: ""

  metrics:
    enabled: false

  primary:
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      size: ""
      annotations:
        # Retains the PVC through `helm uninstall`.
        helm.sh/resource-policy: keep

    service:
      type: ClusterIP
      ports:
        postgresql: 5432
    resources:
      limits: null
      requests: null

  backup:
    enabled: false

  readReplicas:
    replicaCount: 0
