[package]
name = "leptos_website"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Website for the videocall.rs project"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
keywords = ["leptos", "videocall", "webrtc", "webtransport", "quic"]
categories = ["web-programming", "multimedia"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
cfg-if = "1.0.0"
# wasm-bindgen "=0.2.100" (cargo-leptos 0.2.42's bundled bindgen) holds leptos
# at 0.8.14, but leptos_macro floats independently and 0.8.15+ expansions call
# helpers leptos 0.8.14 lacks — pin the macro to the matching release.
leptos = { version = "0.8" }
leptos_macro = { version = "=0.8.14" }
leptos_axum = { version = "0.8", optional = true }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
log = "0.4.17"
simple_logger = { version = "4.0.0", default-features = false, features = ["colors"] }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
	"compression-gzip",
	"fs",
	"trace",
], optional = true }
tokio = { version = "1.22.0", features = ["full"], optional = true }
http = { version = "1" }
thiserror = "1.0.38"
wasm-bindgen = "=0.2.100"
femark = { version = "=0.1.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "HtmlDocument",
    "MediaQueryList",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "EventTarget",
    "NodeList",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Node",
] }
js-sys = { version = "0.3", optional = true }
serde = "1.0.218"

[features]
default = ["csr"]
# In Leptos 0.7+ the csr/hydrate/ssr flags live on the `leptos` crate only;
# leptos_meta / leptos_router pick them up automatically (except `ssr`, which is
# still forwarded explicitly). `experimental-islands` became `leptos/islands`
# and is enabled for the two modes that actually render/hydrate the DOM.
csr = ["leptos/csr"]
testimonials = []
hydrate = [
	"leptos/hydrate",
	"leptos/islands",
	"dep:web-sys",
	"dep:js-sys",
]
ssr = [
	"dep:axum",
	"dep:tower",
	"dep:tower-http",
	"dep:tokio",
	"leptos/ssr",
	"leptos/islands",
	"leptos_meta/ssr",
	"leptos_router/ssr",
	"dep:leptos_axum",
	"dep:femark",
]

[package.metadata.cargo-all-features]
denylist = [
	"axum",
	"tower",
	"tower-http",
	"tokio",
	"leptos_axum",
	"femark",
]
skip_feature_sets = [["csr", "ssr"], ["csr", "hydrate"], ["ssr", "hydrate"]]

[profile.wasm-release]
inherits = "release"
lto = true
opt-level = 'z'
codegen-units = 1

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "leptos_website"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"
# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/output.css"
tailwind-input-file = "input.css"
tailwind-config-file = "tailwind.config.js"
# [Optional] Files in the asset-dir will be copied to the site-root directory
assets-dir = "public"
# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"
# The port to use for automatic reload monitoring
reload-port = 3001
# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
end2end-cmd = "npx playwright test"
#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"
# Set by cargo-leptos watch when building with tha tool. Controls whether autoreload JS will be included in the head
watch = false
# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"
# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
