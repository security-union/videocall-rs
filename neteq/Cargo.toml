[package]
name = "neteq"
version = "1.0.0"
edition = "2021"
description = "Rust port of Google WebRTC NetEq: adaptive jitter buffer and packet loss concealment for audio"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
authors = ["Dario Lencina <dario@securityunion.dev>"]
readme = "README.md"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
keywords = ["audio", "jitter", "webrtc", "neteq", "buffer"]
categories = ["multimedia::audio", "multimedia::encoding", "algorithms", "data-structures"]
include = ["src/**/*", "LICENSE-WEBRTC"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

# WASM/Web dependencies - only enabled with "web" feature
serde_bytes = { version = "0.11", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# The worker serializes stats to a JSON string itself, so the main thread
# never stringifies and re-parses them.
serde_json = { version = "1", optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "MessagePort",
    "console",
] }
console_error_panic_hook = { version = "0.1", optional = true }
log = "0.4"
hound = { version = "3.5", optional = true }
rand = { version = "0.9.1", optional = true, default-features = false, features = ["thread_rng"] }
cpal = { version = "0.15", optional = true }
# Pure-Rust Opus (xiph/opus port, bit-exact, BSD-3): the native Opus codec —
# no C toolchain, wasm-clean core, single `wide` dependency.
ropus = { version = "0.12", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = { version = "0.10", optional = true }
web-time = "1.1.0"
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"], optional = true }
matomo-logger = { path = "../matomo-logger", optional = true, version = "0.1.0" }

[features]
default = ["native", "audio_files"]
audio_files = ["hound"]
# Browser worker. Opus decodes with ropus inside the worker on every browser
# (PARITY_PLAN.md 8.2): NetEq decodes synchronously inside GetAudio, which
# the asynchronous WebCodecs AudioDecoder cannot do.
web = [
    "wasm-bindgen",
    "serde-wasm-bindgen",
    "serde_json",
    "serde_bytes",
    "js-sys",
    "web-sys",
    "console_error_panic_hook",
    "ropus",
    "matomo-logger/worker",
]
native = ["cpal", "clap", "ropus", "rand", "axum", "tokio", "tower", "tower-http", "env_logger"]
# NetEq simulation driver (`tools::NetEqTest`), shared by tests and the parity harness.
tools = []
# Per-tick observer hooks for the C++ parity harness (`parity::Observer`).
# Compiled out without the feature.
parity = []

[dev-dependencies]
env_logger = "0.10"
hound = "3.5"
serde_json = "1"

[[example]]
name = "neteq_player"
required-features = ["native", "audio_files"]

[[bin]]
name = "dashboard_server"
required-features = ["native"]


