user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # include /etc/nginx/conf.d/*.conf;

    map $status $hashed_asset_cache_control {
        ~^(200|304)$ "public, max-age=31536000, immutable";
        default          "no-cache";
    }

    server {
        listen 80;
        listen  [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/csp/*.conf;
        add_header Cache-Control "no-cache" always;
        etag on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            include /etc/nginx/csp/*.conf;
            add_header Cache-Control "no-store" always;
        }

        # trunk hashes videocall-ui-* from cargo's wasm, before wasm-bindgen/wasm-opt; only the
        # build stamps cut_build_push_ui.sh compiles in rename it when just those later steps change.
        location ~ "^/[^/]+-[0-9a-f]{12,16}(_bg)?\.(js|wasm|css)$" {
            include /etc/nginx/csp/*.conf;
            add_header Cache-Control $hashed_asset_cache_control always;
            max_ranges 0;
            try_files $uri =404;
        }
    }
}
