syntax = "proto3";

// Server-authored live caption on room.{room}.captions (user_id =
// SYSTEM_USER_ID, session_id = 0); the relay drops client-sent CAPTIONs.
message CaptionPacket {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TEXT = 1;
    STATUS_ACTIVE = 2;
    STATUS_STOPPED = 3;
  }

  uint64 speaker_session_id = 1;
  bytes speaker_user_id = 2;
  // A higher revision replaces a lower one for the same
  // (speaker_session_id, utterance_id).
  uint64 utterance_id = 3;
  uint32 revision = 4;
  // true: settled caption (translated when the source language differs).
  bool is_final = 5;
  // Untrusted: render as escaped text.
  string text = 6;
  string text_language = 7;
  string source_text = 8;
  string source_language = 9;
  uint64 timestamp_ms = 10;
  Kind kind = 11;
  bytes started_by = 12;

  // text rendered into each caption language the producer serves; a viewer
  // shows the one matching their chosen language. Untrusted, like text.
  message Translation {
    string language = 1;
    string text = 2;
  }
  repeated Translation translations = 13;
}
