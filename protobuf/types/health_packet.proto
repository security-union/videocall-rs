syntax = "proto3";

package health_packet;

message NetEqOperationCounters {
  double normal_per_sec = 1;
  double expand_per_sec = 2;
  double accelerate_per_sec = 3;
  double fast_accelerate_per_sec = 4;
  double preemptive_expand_per_sec = 5;
  double merge_per_sec = 6;
  double comfort_noise_per_sec = 7;
  double dtmf_per_sec = 8;
  double undefined_per_sec = 9;
}

message NetEqNetwork {
  NetEqOperationCounters operation_counters = 1;
}

message NetEqStats {
  double current_buffer_size_ms = 1;
  double packets_awaiting_decode = 2;
  NetEqNetwork network = 3;
  // Number of audio packets received per second (rolling 1s window)
  double packets_per_sec = 4;
  // Delay manager target delay — the algorithm's estimate of how much buffering is
  // needed to absorb observed network jitter. This IS the network jitter metric;
  // < 30ms = excellent, < 75ms = acceptable, >= 75ms = degraded.
  double target_delay_ms = 5;

  // Audio playout latency (#1299): how far behind live this peer's audio
  // playout sits, in milliseconds. This is NetEQ's WebRTC-style FILTERED
  // current buffer level (the EWMA-smoothed playout buffer, updated every
  // decode tick in get_decision) — the exact value the Accelerate gate
  // compares against high_limit. It is the audio sibling of
  // VideoStats.playout_latency_ms (#1252). Distinct from current_buffer_size_ms
  // (field 1, the RAW instantaneous snapshot) and from target_delay_ms
  // (field 5, the TARGET, not the actual): when #1299's lag accumulates this
  // filtered level ratchets up and gates Accelerate off, so this is the field
  // that makes the audio lag observable. 0 = at live; a sustained multi-second
  // value is the #1299 lag. Observability only — no governor/resync attached.
  double playout_latency_ms = 6;
}

message VideoStats {
  // Frames per second the receiver actually DECODED for this stream (#2190).
  // Packets the EXACT-MATCH simulcast guard skipped as wrong-rung are excluded:
  // the relay fails open and forwards ALL of a publisher's rungs to a healthy
  // receiver, so counting arrivals made this read the LADDER SUM (an 8fps 3-rung
  // camera measured ~52 = 7+15+30, above any single rung's ceiling).
  // Still a DECODE-CALL count, not a paint count — see the #1013 note on
  // video_seq_loss_per_sec below for why this can look healthy during a freeze.
  double fps_received = 1;
  double frames_buffered = 2;
  uint64 frames_decoded = 3;
  // Cumulative bytes-derived bitrate. Unlike fps_received this DOES include
  // skipped wrong-rung packets, because they still consumed the receiver's
  // downlink (#2190). The client gates the two on SEPARATE freshness clocks —
  // bitrate on last ARRIVAL, fps on last DECODE — so this stays live for a stream
  // that receives without decoding (hidden tile, or a rung the publisher stopped
  // producing). A live bitrate with fps_received at 0 is therefore the
  // receiving-but-not-decoding signature; both read 0 only when arrivals stop.
  uint64 bitrate_kbps = 4;

  // Buffered video playout latency (#1252): how far behind live this peer's
  // decoded video is, in milliseconds. Spans BOTH receive pipeline stages —
  // the jitter-buffer backlog (stage 1, the dominant arrival-time span) plus
  // the WebCodecs decoder queue (stage 2, bounded by #1024's high-water mark).
  // The receiver only reports a nonzero value while fps_received > 0, so a
  // DecodeBudget-paused or hidden tile (stale buffered frame, no decode) can't
  // masquerade as latency. 0 = at live; sustained >1800ms = the #1252 lag.
  double playout_latency_ms = 5;
  // Stage-1 attribution of playout_latency_ms: just the jitter-buffer backlog
  // span (newest − next-to-release arrival time). Emitted separately so a
  // dashboard can tell whether the #1024 release-side gate REMOVED the backlog
  // or merely RELOCATED it (total stays high while this drops => relocated).
  double playout_stage1_span_ms = 6;
  // Stage-3 paint lag (#1252): decoded-but-unpainted frames living in the
  // worker→main postMessage queue + main-thread paint task queue — a region
  // decode_queue_size() (stage 2) cannot observe — valued at one source frame
  // interval per outstanding frame. Computed in the worker as
  // (frames_emitted − frames_painted) so the FIFO delay of the stats message
  // itself does not hide the backlog. Reported only while fps_received > 0.
  double playout_paint_lag_ms = 7;
  // Cumulative count of resync-to-live governor skips (#1252): how many times the
  // decode-side governor jumped this stream forward to live to shed accumulated
  // lag. A COUNTER: it rises and is preserved across the jitter buffer's flush(),
  // but resets to 0 when the decode pipeline is rebuilt (reset_pipeline() on
  // decoder-error recovery), so consume via increase()/rate(). Unlike the ms gauges
  // above it is folded UNCONDITIONALLY, not gated on fps_received > 0, because a
  // counter must keep reporting even at fps 0. A rising value proves the governor
  // fired in the field.
  uint64 playout_skip_to_live_total = 8;
  // Content-staleness (#1641): the content AGE of the video currently being
  // painted, in milliseconds — how old (capture/wall-clock) the released content
  // is, drift-baselined to cancel the unsynchronized publisher/receiver clock
  // offset. This is content AGE, NOT queue DEPTH: playout_paint_lag_ms (field 7)
  // is (frames_emitted − frames_painted) × interval, so a stream draining
  // minutes-old content at display rate keeps a small queue and reads ~0 — it
  // cannot see the lag. This field can; it surfaces the "video lagged by minutes
  // while playout_latency/paint_lag read ~0" case (#1631 M2). Unlike
  // playout_latency_ms (field 5, capped at MAX_PLAYOUT_AGE_MS = 1800ms) this is
  // UNBOUNDED and routinely EXCEEDS 1800ms when content is genuinely stale.
  // Same fps_received > 0 gate as the ms gauges above: a paused/hidden tile
  // decodes nothing, so when fps == 0 this stays at its 0.0 default ("at live").
  double content_staleness_ms = 9;
  // Lifetime count of keyframe ARRIVALS at this receiver's jitter buffer for this
  // stream (#2201).
  //
  // Do NOT subtract this from keyframe_requests_sent_total (HealthPacket field 23):
  // that field is a single process-wide client counter covering ALL peers and BOTH
  // media kinds, most arrivals here are PERIODIC keyframes nobody requested (so a
  // healthy call drives the difference negative), and the two reset on different
  // boundaries. See the videocall_video_keyframe_arrivals_total metric doc for how
  // to read this instead.
  //
  // Why this exists: the receiver branches on keyframe arrival in four places inside insert_frame
  // and recorded it NOWHERE, so during a freeze no artifact could distinguish "the
  // publisher's keyframe never reached us" (delivery — e.g. #1699 WS head-of-line)
  // from "it arrived and did not recover the picture" (decode/guard/buffer). Those
  // need opposite fixes. The request side was already fully observable, making
  // arrival the one missing link in the chain.
  //
  // Counts arrivals REJECTED as old/duplicate too: the question is whether the
  // publisher's keyframe reached us, for which a retransmit counts (the same
  // reasoning the #1479 arrival gate-clear is built on).
  //
  // A COUNTER with the same semantics as playout_skip_to_live_total (field 8):
  // preserved across the jitter buffer's flush(), reset to 0 when the decode
  // pipeline is rebuilt, so consume via increase()/rate(). Folded
  // UNCONDITIONALLY — NOT gated on fps_received > 0 like the ms gauges — because
  // it must be readable DURING a freeze, which is exactly when fps can be 0.
  //
  // EXPLICIT PRESENCE (`optional`), matching keyframe_requests_sent_total (field 23)
  // rather than the implicit-presence counters above. Load-bearing during a staged
  // rollout: with proto3 implicit presence, a pre-#2201 client that never populates
  // this would report 0, which is numerically indistinguishable from the single most
  // alarming real condition this metric exists to detect ("we requested keyframes and
  // none ever arrived"). Every un-upgraded receiver in a mixed-version meeting would
  // read as total keyframe delivery loss. `optional` lets the server tell "not
  // reported" from "zero arrived" and omit the series entirely for old clients.
  optional uint64 keyframe_arrivals_total = 10;
  // Freeze episodes (#2511): decode-gap counters, folded at fps 0.
  optional uint64 freeze_episodes_total = 11;
  optional uint64 freeze_ms_total = 12;
  optional uint64 max_decode_gap_ms = 13;
  optional uint64 max_content_staleness_ms = 14;
  // Interval MAX; saturating (#2524).
  optional uint64 max_seq_gap_frames = 15;
  // Lifetime; the keyframeless subset is the held-last-good freeze (#2524).
  optional uint64 freshness_evictions_total = 16;
  optional uint64 freshness_evictions_keyframeless_total = 17;
  // Per-stream siblings of PeerStats fields 15/16, which carry the CAMERA stream
  // only, leaving screen share with no loss or PLI signal at all (#2524). Loss
  // counts FRAMES.
  optional double video_seq_loss_per_sec = 18;
  optional double keyframe_requests_per_sec = 19;
}

message PeerStats {
  // Receiver-observed connectivity booleans
  bool can_listen = 1;
  bool can_see = 2;

  // Receiver-observed sender state flags (from peer_status)
  bool audio_enabled = 3; // true if receiver reports sender audio enabled
  bool video_enabled = 4; // true if receiver reports sender video enabled

  // Structured stats
  NetEqStats neteq_stats = 5;
  VideoStats video_stats = 6;

  // Phase 1 metrics: Quality indicators (FIXED: use windowed rates)
  double frames_dropped_per_sec = 7; // Decode errors per second (codec failures: keyframe miss, parse error, decoder reset). NOT CPU-pressure drops.
  // Renamed from audio_packet_loss_pct in PR #318.
  double audio_concealment_pct = 8; // Audio concealment percentage from NetEQ expand events (0.0-100.0)
  optional double avg_decode_latency_ms = 9; // Average decode latency in ms

  // Computed quality scores (0-100). Absent when the stream is inactive.
  // 100 = perfect, 0 = completely broken.
  optional double audio_quality_score = 10; // Audio quality; absent when no audio flowing
  optional double video_quality_score = 11; // Video quality; absent when video disabled
  optional double call_quality_score  = 12; // min(audio, video) — primary alerting metric

  // P1: Cumulative decoder error count (codec failures: keyframe miss, parse error, decoder reset)
  optional uint64 decoder_errors_total = 13;

  // Screen share video stats (separate from camera video_stats field 6)
  VideoStats screen_video_stats = 14;

  // Freeze-detection metrics (issue #1013). videocall_video_fps counts decode
  // calls, not visually distinct frames, so it reads ~30fps while video is
  // frozen. These surface the loss signal that actually proves a freeze.
  // Per-peer sequence loss rate (lost packets/sec, windowed) observed for this
  // peer's video stream. Sustained loss => frozen/glitched video even when
  // fps_received looks healthy.
  optional double video_seq_loss_per_sec = 15;
  // Per-peer keyframe (PLI) requests/sec this client sent TO this peer
  // (windowed). A sustained nonzero rate is the direct symptom of a stream
  // that cannot recover — feeds video_quality_score so it can't read 100/100
  // during a keyframe storm.
  optional double keyframe_requests_per_sec = 16;

  // Per-peer receive-side audio DATAGRAM loss rate (lost audio packets/sec,
  // windowed) observed for this peer while THIS client is on WebTransport
  // (#1878). The audio sibling of video_seq_loss_per_sec (field 15). Nonzero
  // only when audio riding unreliable QUIC datagrams is being dropped (e.g. the
  // browser's incoming-datagram queue overflowing during a main-thread stall) —
  // a pathology previously invisible in every dashboard. ~0 on WebSocket and on
  // E2EE-on WebTransport (both reliable paths).
  //
  // A contiguous gap is booked as its positions shift off the 64-slot reorder
  // window, so the ones still inside it — which may yet arrive — are not
  // counted yet. Read it alongside audio_datagram_raw_loss_per_sec (field 18,
  // uncapped), which leads this field by that still-arrivable tail.
  optional double audio_datagram_loss_per_sec = 17;

  // Per-peer receive-side audio DATAGRAM RAW loss rate (uncapped skipped-
  // sequence sum per second, windowed) observed for this peer while THIS client
  // is on WebTransport (issue 2031). The magnitude companion to
  // audio_datagram_loss_per_sec (field 17): field 17 defers the positions still
  // inside the reorder window to later arrivals, while this field sums the
  // actual sequence-gap sizes un-truncated at the jump, so a
  // battery-throttled receiver losing 20-44 pkt/s reads its true magnitude here.
  // Same WebTransport gate and ~1 Hz cadence as field 17; folds definitional 0.0
  // on WebSocket (audio rides ordered TCP — no datagram loss possible) so the
  // gauge un-latches on a mid-call WT->WS fallback.
  optional double audio_datagram_raw_loss_per_sec = 18;
}

message HealthPacket {
  string session_id = 1;
  string meeting_id = 2;
  bytes reporting_user_id = 3;
  uint64 timestamp_ms = 4;

  // Sender self-reported state (authoritative)
  bool reporting_audio_enabled = 5;
  bool reporting_video_enabled = 6;

  // Per-peer stats keyed by peer_id (to_peer)
  map<string, PeerStats> peer_stats = 7;

  // Active connection info (client-side measured)
  string active_server_url = 8;
  string active_server_type = 9; // "webtransport" | "websocket"
  double active_server_rtt_ms = 10;

  // Phase 1 metrics: Browser state and resource usage
  bool is_tab_visible = 11; // Tab visibility state (true = visible/active)
  optional uint64 memory_used_bytes = 12; // JS heap memory used (Chrome only)
  optional uint64 memory_total_bytes = 13; // JS heap memory limit (Chrome only)
  optional double avg_encode_latency_ms = 14; // Average encode latency in ms
  bool is_tab_throttled = 15; // Browser tab throttling state
  optional uint64 send_queue_bytes = 16; // Bytes queued in send buffer
  optional double packets_received_per_sec = 17; // Inbound packet rate
  optional double packets_sent_per_sec = 18; // Outbound packet rate
  // Display name as entered by the user in the UI (e.g. "Jay at work").
  // Included in every health packet so observers (vcprobe, metrics_server)
  // can learn display names without depending on one-shot PARTICIPANT_JOINED events.
  optional string display_name = 19;

  // Receiver-side metrics: adaptive quality and transport health
  optional uint32 adaptive_video_tier = 20; // Current video encoding tier index (0=best, 7=minimal)
  optional uint32 adaptive_audio_tier = 21; // Current audio encoding tier index (0=high, 3=emergency)
  optional uint64 datagram_drops_total = 22; // Cumulative datagrams dropped (writable locked)
  optional uint64 keyframe_requests_sent_total = 23; // Cumulative keyframe requests sent (PLI)
  optional uint64 websocket_drops_total = 24; // Cumulative WebSocket packets dropped (backpressure)

  // Field 25 (encoder_fps_ratio) removed in #1184: dead encoder-decision telemetry.
  // The NaN-guarded atomic was a dead control input — only ever written, never read.
  reserved 25;
  reserved "encoder_fps_ratio";
  reserved 26;                                     // Was: encoder_worst_peer_fps. Replaced by encoder_p75_peer_fps (field 67) in PR #658; legacy emitters/readers removed in #366.
  reserved "encoder_worst_peer_fps";
  optional uint32 adaptive_screen_tier = 27;       // Screen share quality tier index (0=high, 1=medium, 2=low)
  optional bool screen_sharing_active = 28;        // Whether screen share is currently active

  // Encoder outputs (P1: completes the encoder decision chain)
  optional uint32 encoder_output_fps = 29;         // Actual frames/sec the camera encoder is producing
  optional double encoder_target_bitrate_kbps = 30; // PID controller computed target bitrate in kbps
  // Field 31 (encoder_bitrate_ratio) removed in #1184: dead encoder-decision
  // telemetry. The NaN-guarded atomic was a dead control input — never read.
  reserved 31;
  reserved "encoder_bitrate_ratio";

  // P2: Tier transition events since last health packet
  repeated TierTransition tier_transitions = 32;

  // Field numbers 33-36 reserved for future join-time network probe.
  reserved 33, 34, 35, 36;
  reserved "join_bandwidth_kbps", "join_rtt_ms", "join_jitter_ms", "join_packet_loss_pct";

  // Climb-rate limiter telemetry (PR-H)
  optional bool crash_ceiling_active = 37;           // Whether crash ceiling is currently armed
  optional uint32 crash_ceiling_tier_index = 38;     // Tier index of the ceiling (only set when active)
  optional double crash_ceiling_decay_ms = 39;       // Current decay period in ms
  optional uint64 step_up_blocked_ceiling = 40;      // Cumulative blocks by crash ceiling
  optional uint64 step_up_blocked_slowdown = 41;     // Cumulative blocks by recovery slowdown
  optional uint64 step_up_blocked_screen_share = 42; // Cumulative blocks by screen share ceiling
  repeated TierDwell tier_dwells = 43;               // Tier dwell samples since last packet

  // Encoder error counters (cumulative, since page load).
  // Server derives per-second rates via Prometheus rate().
  optional uint64 camera_encoder_errors_closed_codec = 44;
  optional uint64 camera_encoder_errors_vpx_mem_alloc = 45;
  optional uint64 camera_encoder_errors_configure_fatal = 46;
  optional uint64 camera_encoder_errors_generic = 47;
  optional uint64 camera_encoder_frames_submitted_ok = 48;
  optional uint64 screen_encoder_errors_closed_codec = 49;
  optional uint64 screen_encoder_errors_vpx_mem_alloc = 50;
  optional uint64 screen_encoder_errors_configure_fatal = 51;
  optional uint64 screen_encoder_errors_generic = 52;
  optional uint64 screen_encoder_frames_submitted_ok = 53;

  // Connection-loss reason counters (cumulative since process start)
  optional uint64 connection_handshake_failures_total = 54;
  optional uint64 connection_session_drops_total = 55;

  // TELEM-7: Static client metadata (re-sent every packet for late-joining observers)
  optional uint32 client_cores = 56;                    // navigator.hardwareConcurrency
  optional string client_architecture = 57;             // "x86" | "arm" | ""
  optional string client_gpu_family = 58;               // Normalized GPU family name
  optional string client_network_effective_type = 59;   // "4g" | "3g" | "2g" | "slow-2g"
  optional double client_network_downlink = 60;         // Mbps from navigator.connection
  optional uint32 client_network_rtt = 61;              // ms from navigator.connection
  optional bool client_battery_charging = 62;           // Battery API charging state
  optional double client_battery_level = 63;            // Battery API level 0.0-1.0
  optional uint32 client_capability_score = 64;         // TELEM-6 benchmark iteration count

  // TELEM-8: Long task durations accumulated since last health packet (ms)
  repeated double longtask_durations_ms = 65;

  // TELEM-9: Main-thread rAF cadence (frames per second)
  optional double render_fps = 66;

  // Compatibility field added after TELEM-7/8/9 consumed 56-66.
  optional double encoder_p75_peer_fps = 67;       // sender-side encoder queue depth (backpressure) driving encoder decisions; field NAME frozen — value is queue depth, NOT p75 peer FPS (#1231/#1263)

  // Adaptive decode-budget controller state (#987). Surfaces the receiver-side
  // tile-cap decision so population-scale dashboards can see the adaptive loop's
  // reasoning server-side instead of only in client console logs. Absent when
  // the controller has not produced a snapshot yet (no peers / pre-warmup).
  optional DecodeBudget decode_budget = 68;

  // Non-heap / total-process memory telemetry (#1032). `memory_used_bytes`
  // (field 12) is JS-heap only and stays single-digit MB during the freezes we
  // care about; the multi-GB pressure lives OUTSIDE the JS heap (WASM linear
  // memory, decoded VideoFrame GPU buffers, canvas/GPU textures).
  //
  // WASM linear-memory size in bytes — WebAssembly.Memory.buffer.byteLength.
  // Always available (sync, O(1)); distinct from the JS heap in field 12.
  optional uint64 wasm_memory_bytes = 69;
  // Total agent memory in bytes from performance.measureUserAgentSpecificMemory()
  // — includes GPU-backed and worker allocations. Chrome-only and gated on
  // crossOriginIsolated; sampled in the background and absent when the API is
  // unavailable or has not yet resolved its first reading.
  optional uint64 agent_memory_bytes = 70;

  // Transport re-election outcome counters (dashboard audit Tier B #2/#4;
  // discussion #562). All cumulative since the connection manager was created,
  // re-sent every health packet (same convention as the connection-loss
  // counters in fields 54-55). The relay's metrics_server expands these into a
  // single labeled counter `videocall_client_reelection_total{result=...}` so
  // Grafana can chart re-election rate AND outcome without console logs.
  //
  // Buckets mirror the four terminal branches of
  // ConnectionManager::complete_election:
  //   * proceeded:  a (re-)election switched to a new winning connection.
  //   * aborted:    re-election ran but the winner was not meaningfully better
  //                 (hysteresis), so the existing connection was kept.
  //   * preserved:  all candidates failed but the old connection was still
  //                 fresh, so it was preserved (candidate-failure path, #539).
  //   * failed:     election failed with no usable connection
  //                 ("Election failed: No valid connections") — the on-call
  //                 signal for a participant who has dropped off the call.
  optional uint64 reelection_proceeded_total = 71;
  optional uint64 reelection_aborted_total = 72;
  optional uint64 reelection_preserved_total = 73;
  optional uint64 reelection_failed_total = 74;

  // Send-side simulcast layer counts (#1143). Today the "is simulcast actually
  // engaging?" question is answerable only from console logs; these surface the
  // publisher's live layer state so a dashboard can alert when p90==1 (inert
  // simulcast). Mirrors the SimulcastSendSnapshot the #1095 UI panel already
  // reads from the camera encoder's shared atomics. Camera/screen are folded
  // into one number per kind via media_kind on the server gauge; the camera is
  // the primary signal so these report the CAMERA encoder's state. Absent in
  // single-stream builds is fine — a value of 1 is itself the inert signal.
  //
  // effective_video_layers = the number of simulcast video layers the publisher
  // is currently configured to encode/send (the ladder depth, min(flag,
  // capability)). Stable across PR #1135/#1136's threshold retune, which changes
  // WHEN this is >1, not its meaning.
  optional uint32 effective_video_layers = 75;
  // active_video_layers = how many of those layers are CURRENTLY active
  // (encoded + sent). The AQ controller sheds the top layer(s) under congestion,
  // so this can be < effective_video_layers. The gap is the shed depth.
  optional uint32 active_video_layers = 76;

  // Encoder auto-RESTART counters (#527), cumulative since page load,
  // partitioned by reason. Distinct from the *_errors_* counters above: those
  // count fault OCCURRENCES; these count restart CYCLES (the encode loop
  // re-entering its 'restart loop). The relay's metrics_server expands these
  // into a single labeled counter
  // videocall_encoder_restart_total{kind=camera|screen, reason=closed_codec|memory|configure|other}.
  // Only attached when non-zero (healthy sessions never restart), mirroring the
  // encoder-error fields. Cold start and user-initiated stop do NOT bump these.
  optional uint64 camera_encoder_restarts_closed_codec = 77;
  optional uint64 camera_encoder_restarts_memory = 78;
  optional uint64 camera_encoder_restarts_configure = 79;
  optional uint64 camera_encoder_restarts_other = 80;
  optional uint64 screen_encoder_restarts_closed_codec = 81;
  optional uint64 screen_encoder_restarts_memory = 82;
  optional uint64 screen_encoder_restarts_configure = 83;
  optional uint64 screen_encoder_restarts_other = 84;

  // RTT-probe resilience signals (#522). Surface the client-side RTT-probe
  // backpressure/staleness the merged #522 core already tracks so operators can
  // see probe-pipeline health across the fleet server-side. Both are cumulative
  // since the ConnectionManager was created and re-sent every health packet
  // (same convention as the connection-loss counters in fields 54-55); the
  // relay's metrics_server `.set()`s each onto a per-reporter GaugeVec so Grafana
  // charts rate()/increase() exactly as for the sibling *_total gauges.
  //
  // rtt_probe_dropped_total = cumulative count of RTT probes dropped because the
  // in-flight probe queue was at MAX_INFLIGHT_PROBES (queue-cap backpressure).
  optional uint64 rtt_probe_dropped_total = 85; // (#522)
  // rtt_probe_stale_suppressions_total = cumulative count of 1 Hz diagnostics
  // ticks on which the active link's RTT-probe pipeline was stale and so
  // active_server_rtt was suppressed (observability-only; does NOT change the
  // suppression/re-election behavior, only counts it).
  optional uint64 rtt_probe_stale_suppressions_total = 86; // (#522)

  // ---- #1482: per-peer device / hardware metrics ("if available") ----------
  // Every field below is OPTIONAL and OMITTED (proto3 absent / Rust `None`)
  // when the sending browser does not expose the source API — never a bogus
  // default. STATIC fields (os/device_type/device_memory_gb) are read once per
  // tick from JS globals; the dynamic load gauge is computed per interval.
  //
  // Human OS + version, e.g. "macOS 14.5", "Windows 11". Source:
  // navigator.userAgentData.getHighEntropyValues() platform+platformVersion
  // (Chromium), else a navigator.userAgent heuristic. Absent when neither is
  // available (e.g. Firefox/Safari lack userAgentData high-entropy values).
  optional string client_os = 87; // (#1482)
  // Device form factor: "desktop" | "mobile" | "tablet". Source:
  // navigator.userAgentData.mobile + model (Chromium), else a UA heuristic.
  // Absent when the form factor cannot be determined.
  optional string client_device_type = 88; // (#1482)
  // 0.0-1.0 MAIN-THREAD busy fraction over the last health interval
  // (sum of 'longtask' durations / interval_ms). This is a CPU PROXY for the
  // sender's main thread, explicitly NOT system-wide CPU usage. Source:
  // PerformanceObserver('longtask') (Chromium). Absent (None) when the
  // 'longtask' entry type is unsupported (Firefox/Safari) — distinct from a
  // genuine 0.0 (idle main thread on a browser that DOES support longtask).
  optional double client_main_thread_load = 89; // (#1482)
  // navigator.deviceMemory: total device RAM tier in GIGABYTES. Coarse and
  // privacy-quantized by the browser (one of 0.25/0.5/1/2/4/8, capped at 8).
  // Chromium only; absent on Firefox/Safari (which do not implement the API).
  optional double client_device_memory_gb = 90; // (#1482)

  // ---- #1561: Send-side simulcast layer counts (SCREEN + AUDIO) -----------
  // Mirrors effective_video_layers/active_video_layers (fields 75-76) for the
  // screen and audio encoders. Enables "is the adaptive system actually
  // shedding layers?" observability that was camera-only prior to this.
  optional uint32 effective_screen_layers = 91; // (#1561)
  optional uint32 active_screen_layers = 92; // (#1561)
  optional uint32 effective_audio_layers = 93; // (#1561)
  // Audio congestion ceiling: the congestion-driven layer cap (1-3 or
  // MAX=uncapped). Distinct from effective: effective is the configured
  // maximum, ceiling is the congestion-driven dynamic cap.
  optional uint32 audio_congestion_ceiling = 94; // (#1561)

  // ---- #1561: Receiver-side layer selection per-peer per-kind ---------------
  // Maps peer session_id (string) → currently-chosen layer index (0-based).
  // Only populated for peers where the chooser is CONSTRAINING below the top
  // layer (same rule as LAYER_PREFERENCE emission: no entry when receiving the
  // top layer, which is the common unconstrained case). Keyed by session_id as
  // decimal string (matching peer_stats).
  map<string, uint32> received_video_layer = 95; // (#1561)
  map<string, uint32> received_screen_layer = 96; // (#1561)
  map<string, uint32> received_audio_layer = 97; // (#1561)

  // ---- #1556: Connection medium and power state diagnostics ----------------
  // navigator.connection.type: "wifi"|"ethernet"|"cellular"|"bluetooth"|
  // "none"|"unknown". The actual MEDIUM, not the throughput estimate that
  // effectiveType provides. Chrome/Edge only; absent on Firefox/Safari.
  optional string client_network_type = 98; // (#1556)
  // navigator.connection.downlinkMax: max downlink speed of the connection
  // medium in Mbps (e.g. wifi=54, ethernet=1000). 0 or absent when unknown.
  optional double client_network_downlink_max = 99; // (#1556)
  // Computed throttle flag: true when capability_score / hardware_concurrency
  // is anomalously low (< 150), indicating CPU throttle, thermal throttle, or
  // a restrictive Windows power plan. Derived client-side from two existing
  // metrics (no new browser API). Absent when either input is unavailable.
  optional bool client_cpu_throttled = 100; // (#1556)

  // Actual number of audio simulcast layers currently published after applying
  // both the congestion ceiling and the user-selected send ceiling. Kept
  // separate from audio_congestion_ceiling so a manual user cap is never
  // attributed to congestion in telemetry.
  optional uint32 active_audio_layers = 101; // (#1561)

  optional uint64 unistream_bytes_offered_total = 102; // (#1737 Phase 0)
  optional uint64 unistream_bytes_drained_total = 103; // (#1737 Phase 0)

  optional uint64 unistream_stale_delta_drops_total = 104; // (#1737 Phase 1)

  // ---- issue 2031: WebTransport receive-health telemetry (per-client) --------
  // All four are per-CLIENT (receiver) properties, re-sent every health packet.
  // Wire presence on a WebSocket session differs per field (proto3 omits only
  // absent/None fields):
  //   * 105 (read-loop max gap) is ALWAYS present — folded unconditionally for
  //     recover-to-0 semantics, so it carries its 0.0 default (~9 bytes) on WS.
  //   * 106 (concealment) is present on WS whenever an audio source is active
  //     (it is transport-agnostic; the server splits it by transport at ingest).
  //   * 107/108 (queue read-back) are proto3-absent on a WebSocket-only client —
  //     the incoming-datagram queue is never configured, so they cost nothing on
  //     the wire there.

  // Max gap in milliseconds between successive incoming-datagram `.read()`
  // resolutions on the main-thread reader, over the interval since the last
  // health packet (read-and-reset window). The direct causal signal for "the
  // main-thread datagram reader was starved": a long task blocks `.read()`, the
  // browser's network process age-drops the OLDEST queued datagrams, and audio
  // is silently lost. A sustained high value (hundreds of ms) is reader
  // starvation; ~0 is a healthy reader. WebTransport-only.
  //
  // CAVEAT — meaningful only while datagrams are actually flowing. `.read()`
  // legitimately blocks when there is nothing to read: total audio silence (all
  // peers muted or in DTX) registers large BENIGN gaps, and a transport teardown
  // can register a one-shot gap on the final read before the next session resets
  // the anchor. Read alongside the inbound datagram rate (packets_received_per_sec
  // / neteq packets_per_sec) — a large gap with a live inbound rate is real
  // starvation; a large gap with ~0 inbound is just silence, not a fault.
  optional double wt_datagram_read_loop_max_gap_ms = 105; // (issue 2031)

  // Per-client mean audio concealment percentage (0-100) over ACTIVE audio
  // sources this tick — the same windowed expand/packets ratio the per-peer
  // PeerStats.audio_concealment_pct and the [AUDIO_SCALE] aggregate use, meaned
  // across sources. Exported server-side split by the reporter's active
  // transport (active_server_type, field 9) so the WS-vs-WT concealment severity
  // gap is a single labeled gauge. Absent when no source is actively delivering
  // audio (absent != 0% concealment).
  optional double client_audio_concealment_pct = 106; // (issue 2031)

  // Observed post-set incoming-datagram queue parameters (issue-1878 mitigation
  // read-back): the values `WebTransportDatagramDuplexStream` reports AFTER the
  // client set incomingHighWaterMark / incomingMaxAge. Empirically answers, per
  // browser, whether the current Chromium honors the setters (an open question):
  // a high_water_mark reading back at the requested target confirms the capacity
  // knob took effect.
  optional double wt_incoming_datagram_high_water_mark = 107; // (issue 2031)
  // Observed post-set incomingMaxAge in milliseconds. -1.0 is a sentinel for
  // "unbounded" (the spec's `null` default, read back as NaN) — either the
  // browser left the queue un-age-capped or did not honor the setter; any finite
  // value near the requested cap confirms the staleness knob took effect.
  optional double wt_incoming_datagram_max_age_ms = 108; // (issue 2031)

  // Actual frames/sec the SCREEN encoder's base layer is producing (issue 2147).
  //
  // WHY a separate field rather than reusing encoder_output_fps (field 29): that
  // field is CAMERA-only and has no media_kind discriminator, so there was
  // previously NO publisher-side screen-encoder fps signal anywhere in the
  // system. In the #2143 run the camera gauge read a healthy 7-9 fps throughout a
  // screen-share-triggered room-wide freeze (856 freshness_skip events,
  // head_age up to 23s) because the camera encoder genuinely WAS healthy — the
  // screen encoder, where the trouble was, was unobservable.
  //
  // HONESTY (deliberately NOT gated on `> 0`, unlike field 29 — see #2079): a
  // screen encoder that has STOPPED producing must be distinguishable from one
  // that never started. Field 29's `> 0` gate makes a genuine total stall absent
  // from the wire and therefore indistinguishable from never-started; that
  // conflation is exactly what made it useless as a freeze signal. This field is
  // emitted whenever the screen encoder is WIRED, including an honest 0.
  //
  // ⚠️ THIS FIELD ALONE CANNOT SEE A FREEZE. It counts encoded CHUNKS, and the
  // static/PLI synthetic retained-frame re-encodes share the same base-layer output
  // callback as fresh captures, so during the #1899/#2143 stall it reads a small
  // NONZERO while receivers sit on minutes-stale content. Pair it with
  // `screen_encoder_stall_episodes` / `screen_encoder_max_stall_gap_ms`
  // (fields 110/111), which count the tick-starvation episodes that produce exactly
  // that symptom. This field answers "is the encoder emitting anything at all";
  // those answer "is what it emits actually fresh".
  //
  // WHEN IS IT ABSENT? Only when no screen encoder has been bound to the health
  // reporter at all. The dioxus-ui client constructs its ScreenEncoder eagerly at
  // Host mount and binds it in the same pass, so in THAT client the field is
  // effectively always present — absence is reserved for other/future consumers
  // of this proto that never bind one (and for old clients predating this field).
  // Do NOT read absence as "not sharing"; use screen_sharing_active for that.
  //
  // READING A 0: a legitimately static share reports 0 and that is CORRECT, not a
  // fault — a static share emits ~4 synthetic keyframes on the 3s floor
  // (SCREEN_STATIC_KEYFRAME_FLOOR_BUDGET) over ~12s and then goes quiet by design.
  // A 0 while NOT sharing is equally expected (the encoder is bound but idle, and
  // stop() resets the atom to 0). So pair this with screen_sharing_active
  // (field 28) to separate the states that matter:
  //   * 0 with active=false → not sharing. Nothing to see.
  //   * 0 with active=true  → sharing; static-and-fine OR stalled. Disambiguate
  //                           with the receivers' rising content_staleness_ms /
  //                           freshness_skip, which a static share does not show.
  //   * >0 with active=true → sharing and producing.
  // Screen fps also has a deliberately longer idle decay than camera
  // (SCREEN_ENCODER_FPS_IDLE_DECAY_MS = 5000 vs 2000) precisely because static
  // shares are expected.
  optional uint32 screen_encoder_output_fps = 109; // (issue 2147)

  // Screen encoder TICK-STARVATION stall signal (issue 2147; discussion 1960
  // issue 2). These are the fields that can actually see a screen freeze — read
  // them TOGETHER with screen_encoder_output_fps above, which on its own cannot.
  //
  // WHY fps ALONE IS NOT ENOUGH (the #2143 mechanism). `screen_encoder_output_fps`
  // counts encoded CHUNKS, and the static/PLI synthetic retained-frame re-encodes
  // go through the same base-layer output callback as fresh captures — the callback
  // cannot tell them apart. So during the #1899/#2143 freeze (PLI answers
  // collapsing while the encoder still emits some output) the fps field reads a
  // small NONZERO — "sharing and producing" — while every receiver is frozen on
  // minutes-stale content. `content_staleness_ms` does not rescue it either: that
  // gauge is gated on `fps_received > 0`, so a no-arrivals stall reports its 0.0
  // "at live" default.
  //
  // Each stall episode is one `'encode` loop-tick resume whose wall-clock gap since
  // the previous tick exceeded SCREEN_ENCODER_STALL_GAP_MS — i.e. a main-thread
  // freeze during which the encoder could not sample fresh capture and receivers
  // saw `fps > 0` on stale re-encoded content. That is exactly the symptom, made
  // countable.
  //
  // HOW TO READ THE PAIR:
  //   * fps > 0, episodes FLAT      → genuinely healthy.
  //   * fps > 0, episodes RISING    → THE FREEZE. Re-encoded stale content.
  //   * fps == 0, sharing active    → idle/static share (honest, see field 109).
  //
  // Cumulative since PAGE LOAD (not since the last packet) and never reset, so
  // consume with increase()/rate(). Emitted only once nonzero, matching the
  // `screen_encoder_restarts_*` counters' convention: a 0 carries no information
  // for a monotonic counter, unlike the fps gauge where 0 is a real reading.
  optional uint64 screen_encoder_stall_episodes = 110; // (issue 2147)
  // Largest single tick-starvation gap observed since page load (ms, rounded).
  // The severity companion to the episode count: 3 episodes of 200ms is jitter,
  // 3 episodes with a 23000ms max is the #2143 incident. Same emit-when-nonzero
  // convention as the counter above.
  optional uint64 screen_encoder_max_stall_gap_ms = 111; // (issue 2147)
  // FITTED per-layer camera encode geometry and measured output fps (issue 2170),
  // lowest ladder index first. Rationale and the bots-vs-webcams measurement are
  // in issue 2170 -- kept out of this comment because protoc embeds comment TEXT
  // in the descriptor blob shipped to every wasm client.
  //
  // Dims last published by the encode loop for each ACTIVE rung, NOT the rung's
  // bounding box (a rung is a ceiling the capture is fitted inside without
  // upscaling). Omitted, never zero-filled, for camera-off/shed/unbuilt rungs; an
  // empty field also covers a client predating this field, and both mean "no
  // geometry to show."
  repeated EncoderLayerGeometry camera_layer_geometry = 112; // (issue 2170)

  // Un-framed payload bytes offered to the WebSocket send path per stream, billed
  // before every gate so a closed socket is included (issue 2510). NOT comparable
  // with the framed, post-admission unistream_bytes_* fields.
  optional uint64 ws_offered_bytes_audio = 113;
  optional uint64 ws_offered_bytes_video = 114;
  optional uint64 ws_offered_bytes_screen = 115;
  optional uint64 ws_offered_bytes_control = 116;
  // Discarded by the 1 MiB bufferedAmount guard. A failed send is in neither, so
  // offered != accepted + dropped + inactive-discarded.
  optional uint64 ws_dropped_bytes_audio = 117;
  optional uint64 ws_dropped_bytes_video = 118;
  optional uint64 ws_dropped_bytes_screen = 119;
  optional uint64 ws_dropped_bytes_control = 120;

  // Discarded because the socket was neither CONNECTING nor OPEN — a close or a
  // flap, not backpressure (issue 2577). Disjoint from ws_dropped_bytes_* above.
  optional uint64 ws_inactive_dropped_frames_audio = 121;
  optional uint64 ws_inactive_dropped_frames_video = 122;
  optional uint64 ws_inactive_dropped_frames_screen = 123;
  optional uint64 ws_inactive_dropped_frames_control = 124;
  optional uint64 ws_inactive_dropped_bytes_audio = 125;
  optional uint64 ws_inactive_dropped_bytes_video = 126;
  optional uint64 ws_inactive_dropped_bytes_screen = 127;
  optional uint64 ws_inactive_dropped_bytes_control = 128;
  // The same discards decomposed by readyState instead of by stream; never sum
  // across the decompositions. Set UNCONDITIONALLY, including zero, per the
  // keyframe_arrivals_total convention (field 10).
  optional uint64 ws_inactive_dropped_frames_by_state_closing = 129;
  optional uint64 ws_inactive_dropped_frames_by_state_closed = 130;
}

// One active camera rung's FITTED geometry and measured output rate.
message EncoderLayerGeometry {
  // 0 = base ladder index, matching the received_layer gauge convention.
  uint32 layer_id = 1;
  // FITTED encode width in px, not the rung's bounding-box width.
  uint32 width = 2;
  // FITTED encode height in px, not the rung's bounding-box height.
  uint32 height = 3;
  // MEASURED output fps for this rung over the last ~1s window, not nominal
  // target_fps. ABSENT until the first window closes; PRESENT 0 is a measured
  // stall -- the two are deliberately distinct.
  optional uint32 output_fps = 4;
}

// Receiver-side adaptive decode-budget state (#987). Mirrors the
// AdaptiveQuality tier fields on HealthPacket: a periodic snapshot of the
// current decision the local controller has reached for how many video tiles
// to decode.
message DecodeBudget {
  uint32 effective_cap = 1;        // Current effective cap on simultaneously decoded tiles
  uint32 natural = 2;              // Natural/unconstrained tile count the layout would show
  bool pressured = 3;              // Pressured latch engaged (loop owns the cap)
  OverrideMode override_mode = 4;  // Auto vs Fixed
  // Set only when override_mode == OVERRIDE_MODE_FIXED: the user's hard tile cap.
  uint32 override_fixed_n = 5;

  // Tiles actually being decoded right now = min(effective_cap, natural)
  // (#1143). `effective_cap` is the BUDGET ceiling and `natural` is what the
  // layout WOULD show unconstrained; neither alone answers "how many videos is
  // this client actually decoding?" when the layout has fewer tiles than the
  // cap allows. This is that number — the per-client "videos showing" signal the
  // observability issue asks for.
  uint32 active_set = 6;

  // Manual override mode for the controller.
  enum OverrideMode {
    OVERRIDE_MODE_UNSPECIFIED = 0; // Treated as Auto by readers
    OVERRIDE_MODE_AUTO = 1;        // Adaptive loop decides the cap
    OVERRIDE_MODE_FIXED = 2;       // User hard-pinned the cap (see override_fixed_n)
  }
}

message TierTransition {
  string direction = 1;    // "up" or "down"
  string stream = 2;       // "video", "audio", "screen"
  string from_tier = 3;    // tier label e.g. "hd_1080p", "medium_480p"
  string to_tier = 4;      // tier label
  string trigger = 5;      // "fps", "bitrate", "congestion", "coordination"
}

message TierDwell {
  string tier = 1;       // Tier label (e.g. "hd_1080p")
  double dwell_ms = 2;   // Time spent in this tier before transitioning
}
