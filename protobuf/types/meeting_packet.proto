syntax = "proto3";

// Meeting lifecycle messages sent between server and clients
message MeetingPacket {
  enum MeetingEventType {
    MEETING_EVENT_TYPE_UNKNOWN = 0;
    // Meeting started - sent to participants when they join
    MEETING_STARTED = 1;
    // Meeting ended - sent when host leaves or last participant leaves
    MEETING_ENDED = 2;
    // Participant joined the meeting
    PARTICIPANT_JOINED = 3;
    // Participant left the meeting
    PARTICIPANT_LEFT = 4;
    // Host joined, meeting now active
    MEETING_ACTIVATED = 5;
    // Admitted from waiting room
    PARTICIPANT_ADMITTED = 6;
    // Rejected from waiting room
    PARTICIPANT_REJECTED = 7;
    // Waiting room list changed
    WAITING_ROOM_UPDATED = 8;
    // Participant updated their display name
    PARTICIPANT_DISPLAY_NAME_CHANGED = 9;
    // Meeting settings updated mid-meeting
    MEETING_SETTINGS_UPDATED = 10;
    // Host requests participants mute their mic
    HOST_MUTE_PARTICIPANT = 11;
    // Host requests participants disable their video
    HOST_DISABLE_VIDEO = 12;
    // Host removes a participant from the meeting
    PARTICIPANT_KICKED = 13;
    // Server-internal: triggers Active peers to re-broadcast PARTICIPANT_JOINED
    PARTICIPANT_LIST_REQUEST = 14;
    // Host granted to a participant
    HOST_GRANTED = 15;
    // Host revoked from a participant
    HOST_REVOKED = 16;
  }

  MeetingEventType event_type = 1;
  string room_id = 2;
  uint64 start_time_ms = 3;
  string message = 4;
  bytes creator_id = 5;
  int64 participant_count = 6;
  // For ADMITTED/REJECTED: affected user's ID
  bytes target_user_id = 7;
  // For ADMITTED: JWT to upgrade connection
  string room_token = 8;
  uint64 session_id = 9;
  // Display name of the participant (for PARTICIPANT_JOINED/LEFT events)
  bytes display_name = 10;
  // Whether the participant joined as an unauthenticated guest
  // (for PARTICIPANT_JOINED/LEFT events). Sourced from the
  // authenticated JWT is_guest claim on the server. Default false
  // keeps the wire format backward-compatible with older peers.
  bool is_guest = 11;
  // For PARTICIPANT_LIST_REQUEST: the requesting joiner's CLAIMED per-tab
  // instance_id. Relay-internal — PARTICIPANT_LIST_REQUEST is consumed by
  // the receiving relay and never forwarded to clients.
  //
  // NOT server-authoritative. The value originates as the client's own
  // ?instance_id= connect parameter; the joiner's relay copies it onto the
  // wire after a length/emptiness check only, and never checks it against
  // the authenticated JWT sub. Treat it as a hint a client could forge.
  //
  // It lets a responding relay count one client's dual election candidate
  // sessions (WS + WT, distinct session_id, same instance_id) as ONE
  // distinct requester, which selects a unicast re-announce instead of a
  // broadcast. That is the only decision keyed on it, and a false claim
  // resolves toward broadcast — reaching more sessions, never fewer — so a
  // forged value cannot withhold a presence answer from anyone. Empty when
  // the joiner supplied no instance_id or the request came from an older
  // relay; receivers then fall back to keying on session_id, which is the
  // pre-#1600 behaviour.
  string requester_instance_id = 12;
}

