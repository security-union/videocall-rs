[package]
name = "videocall-client"
version = "5.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-performance WebAssembly video conferencing client for videocall.rs, supporting WebTransport and WebSocket."
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
authors = [
    "Dario Lencina <dario@securityunion.dev>",
]
keywords = ["quic", "webtransport", "wasm", "video-conferencing"]
categories = ["network-programming", "multimedia"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.3"
anyhow = { workspace = true }
cbc = { version = "0.1.2", features = ["alloc"] }
futures = "0.3"
gloo = "0.8.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-utils = { version = "0.1", features = ["serde"] }
js-sys = "0.3.107"
log = "0.4.19"
protobuf = "3.3.0"
rand = { version = "0.8.5", features = ["std_rng", "small_rng"] }
rsa = "0.9.2"
videocall-types = { path= "../videocall-types", version = "6.0.1" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-time = "1.1.0"
serde = { version = "1", features = ["derive"] }
videocall-transport = { path = "../videocall-transport", version = "0.2.2" }
prost = "0.11"
videocall-codecs = { path = "../videocall-codecs", features = ["wasm"], version = "0.1.16" }
neteq = { path = "../neteq", features = ["web"], version = "1.0.1", optional = true,  default-features = false }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
videocall-diagnostics = { path = "../videocall-diagnostics", version = "0.1.4" }
serde_json = { version = "1.0" }
async-broadcast = "0.7.2"
# Microphone encode path (src/encode/mic_opus.rs, run by the
# audio_encoder_worker bin): pure-Rust Opus, same crate NetEq decodes with,
# and rubato's sinc resampler to bring any capture rate to Opus's 48 kHz
# (default features off: the FFT resampler would add ~170 KB to the worker).
# The lib's main-thread code never calls into them, so they are dead-stripped
# from the UI wasm and only land in the worker's wasm.
ropus = "0.12"
rubato = { version = "5.1", default-features = false }

[features]
default = []

[dependencies.web-sys]
version = "0.3.107"
features = [
    "AudioTrack",
    "AudioData",
    "AudioParam",
    "AudioEncoder",
    "AudioEncoderInit",
    "AudioEncoderConfig",
    "AudioDecoder",
    "AudioDecoderInit",
    "AudioDecoderConfig",
    "AudioContext",
    "AudioContextState",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "GainOptions",
    "GainNode",
    "console",
    "CodecState",
    "CanvasRenderingContext2d",
    "EncodedAudioChunk",
    "EncodedAudioChunkInit",
    "EncodedAudioChunkType",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "MediaStreamAudioDestinationNode",
    "MessageChannel",
    "ChannelCountMode",
    "ErrorEvent",
    "Worker",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MessagePort",
    "OffscreenCanvas",
    "AudioDestinationNode",
    "AudioContextOptions",
    "AudioDataCopyToOptions",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaTrackSettings",
    "MediaStreamTrackProcessor",
    "MediaStreamTrackProcessorInit",
    "MediaStreamTrackGenerator",
    "MediaStreamTrackGeneratorInit",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "MediaStreamAudioSourceNode",
    "HtmlVideoElement",
    "MediaStreamConstraints",
    "ReadableStream",
    "ReadableStreamGetReaderOptions",
    "ReadableStreamDefaultReader",
    "VideoEncoder",
    "VideoEncoderInit",
    "VideoEncoderConfig",
    "VideoEncoderEncodeOptions",
    "VideoFrame",
    "VideoFrameInit",
    "VideoTrack",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "LatencyMode",
    "HtmlAudioElement",
    "AudioDataInit",
    "AudioSampleFormat",
    "TransformStream",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaTrackConstraints",
    "CanvasRenderingContext2d",
    "Performance",
    "AnalyserNode",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "MediaSource",
    "DomException",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
]

# 1.0 no longer reads a clock, so the old "wasm" feature (web-time) is not
# needed.
[dependencies.pidgeon]
version = "1.0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.20"
# tests/mic_dtx_neteq.rs: native round trip of the mic encoder's DTX stream
# through the receiver's timestamp mapper and NetEq.
neteq = { path = "../neteq", version = "1.0.1", default-features = false, features = ["ropus"] }

