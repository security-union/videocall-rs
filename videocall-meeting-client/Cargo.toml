[package]
name = "videocall-meeting-client"
version = "0.2.1"
edition = "2021"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["Dario Lencina <dario@securityunion.dev>"]
keywords = ["videocall", "meeting", "api", "client"]
categories = ["network-programming"]
description = "Cross-platform REST client for the videocall.rs meeting API"

[dependencies]
videocall-meeting-types = { path = "../videocall-meeting-types", version = "0.3.1" }
# rustls instead of reqwest's default native-tls, so native consumers (the
# videocall-cli Raspberry Pi cross-build in particular) don't link OpenSSL.
# `rustls-tls-native-roots` trusts the OS root store, like native-tls did, and
# carries ring as its own provider: reqwest uses an installed process-default
# rustls provider if there is one, else ring, so no caller has to install one.
# TLS features are no-ops on wasm32 (dioxus-ui), where fetch does TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
# device-session only: the server's `Date` header (clock correction) and the
# seed and codes it hands out.
httpdate = { version = "1", optional = true }
secrecy = { version = "0.10", optional = true }

[features]
# The device key login and signed session (videocall-cli). Off by default:
# dioxus-ui builds this crate for wasm and must not pull in the crypto.
device-session = ["videocall-meeting-types/device-crypto", "dep:httpdate", "dep:secrecy"]
