[package]
name = "videocall-meeting-types"
version = "0.2.0"
edition = "2021"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = [
    "Dario Lencina <dario@securityunion.dev>"
]
keywords = ["videocall", "meeting", "api", "types"]
categories = ["network-programming"]
description = "Shared API types for the videocall.rs meeting backend"

[features]
# Device-token signing and verification (videocall-cli, meeting-api). Off by
# default so the browser build carries no signing code.
device-crypto = [
    "dep:ed25519-dalek", "dep:ed25519", "dep:jsonwebtoken", "dep:getrandom", "dep:secrecy", "dep:subtle",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "alloc"], optional = true }
# Only to switch on `zeroize`, which wipes the key in ed25519's PKCS#8
# scratch buffers; ed25519-dalek's own `zeroize` feature doesn't forward it.
ed25519 = { version = "2.2", default-features = false, features = ["zeroize"], optional = true }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"], optional = true }
getrandom = { version = "0.3", optional = true }
secrecy = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
serde_json = "1.0"
