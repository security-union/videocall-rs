[package]
name = "videocall-meeting-types"
version = "0.1.2"
edition = "2021"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = [
    "Dario Lencina <dario@securityunion.dev>"
]
keywords = ["videocall", "meeting", "api", "types"]
categories = ["network-programming"]
description = "Shared API types for the videocall.rs meeting backend"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# The `#[cfg(test)]` module in `src/responses.rs` has always called
# `serde_json::{to_string, from_str}` without the crate ever declaring it, so
# `cargo test -p videocall-meeting-types` did not compile. Nothing caught it:
# this crate has no test step in `.github/workflows/pr-check-rust-hcl.yaml` and
# `cargo clippy --all` builds only the lib target, not the test target.
serde_json = "1.0"
