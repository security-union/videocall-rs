[package]
name = "videocall-transport"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Framework-agnostic WebSocket and WebTransport wrappers for videocall.rs"
homepage = "https://github.com/security-union/videocall-rs"
repository = "https://github.com/security-union/videocall-rs"
readme = "README.md"
authors = [
    "Dario Lencina <dario@securityunion.dev>",
]
keywords = ["quic", "webtransport", "websocket", "wasm"]
categories = ["network-programming", "wasm"]
exclude = ["tests/"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "web_sys_unstable_apis"]
all-features = true
targets = ["wasm32-unknown-unknown"]

[features]
# Netsim e2e support (issue #1398). Gates the `force_*` counter bumpers
# (`force_unistream_ready_stall`, `force_websocket_drop`) used by the netsim e2e
# harness to deterministically drive the uplink-distress counters the encoders
# consult. OFF by default → zero production cost (the bumpers are compiled out).
# Enabled transitively when `videocall-client`'s `netsim` feature is on (the
# dioxus-ui e2e build sets `TRUNK_BUILD_FEATURES=netsim`).
netsim = []

[[bin]]
name = "wt_session_worker"
path = "src/bin/wt_session_worker.rs"
# The bin holds no tests; without this a wasm32 `cargo test` links a second
# test executable from it.
test = false

[dependencies]
anyhow = { workspace = true }
futures = "0.3"
gloo = "0.8.0"
gloo-console = "0.3"
gloo-timers = { version = "0.2", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
protobuf = "3.3.0"
thiserror = "1.0"
videocall-types = { path = "../videocall-types", version = "5.0.0" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "CloseEvent",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "Performance",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "ReadableStream",
    "TransformStream",
    "ReadableStreamDefaultReader",
    "WebSocket",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportDatagramDuplexStream",
    "WebTransportHash",
    "WebTransportOptions",
    "WebTransportReceiveStream",
    "WebTransportSendStreamOptions",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "ReadableStreamReadResult",
    "WebTransportSendStream",
    "Window",
]

# Only the wasm session-worker bin installs the panic hook.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
# The inbound framing tests moved here from videocall-client with #2728 and
# include browser-only cases; this matches that crate's dev-dependency so the
# move is behaviour-preserving.
wasm-bindgen-test = "0.3.20"
